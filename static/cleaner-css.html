<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظف CSS المتقدم</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,sans-serif;padding:16px;background:#0b0b0f;color:#fff;margin:0;line-height:1.6}
h1{font-size:19px;margin:0 0 6px}
h2{font-size:15px;margin:16px 0 8px;color:#0a84ff}
p{font-size:12.5px;color:#8e8e93;margin:0 0 12px}
button{width:100%;padding:16px;border-radius:12px;font-size:15px;font-weight:bold;border:none;cursor:pointer;font-family:inherit;margin:6px 0}
.btn-primary{background:linear-gradient(135deg,#0a84ff,#0062d2);color:#fff}
.btn-success{background:linear-gradient(135deg,#32d74b,#1a9f3a);color:#fff}
.btn-warn{background:linear-gradient(135deg,#ff9f0a,#d70015);color:#fff}
button:active{transform:scale(0.98)}
button:disabled{opacity:0.5;cursor:not-allowed}
.report{padding:14px;background:#16161c;border-radius:12px;margin-top:10px;font-size:12.5px}
.item{padding:8px 12px;background:#0b0b0f;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .val{font-weight:bold;color:#32d74b}
.badge{background:rgba(255,69,58,0.2);color:#ff453a;padding:3px 8px;border-radius:6px;font-weight:bold;font-size:11px;flex-shrink:0}
.badge.green{background:rgba(50,215,75,0.2);color:#32d74b}
.badge.blue{background:rgba(10,132,255,0.2);color:#0a84ff}
details{margin:6px 0}
summary{cursor:pointer;font-size:12px;color:#8e8e93;padding:4px 0}
.code-preview{background:#0b0b0f;padding:10px;border-radius:8px;font-family:monospace;font-size:11px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#aaa;margin-top:5px}
</style>
</head>
<body>
<h1>🎨 منظف CSS المتقدم</h1>
<p>ينظف style.css بعمق: يحذف التكرارات، يدمج كل القواعد، ويحذف الفارغة.</p>
<button id="btnAnalyze" class="btn-primary" onclick="analyze()">🔍 حلل و نظف</button>
<div id="report"></div>
<button id="dlBtn" class="btn-success" style="display:none" onclick="dl()">💾 تحميل style.css النظيف</button>

<script>
let cleanedCSS = '';
let stats = {};

async function analyze() {
  const report = document.getElementById('report');
  const btn = document.getElementById('btnAnalyze');
  btn.disabled = true;
  report.innerHTML = '<div class="report">⏳ جاري تحميل style.css...</div>';
  document.getElementById('dlBtn').style.display = 'none';

  try {
    const url = 'https://raw.githubusercontent.com/benssariyassine-tech/iPA-Store/main/static/style.css';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const original = await resp.text();
    const originalSize = original.length;

    // 1. حذف التعليقات
    let css = original.replace(/\/\*[\s\S]*?\*\//g, '');

    // 2. تحليل القواعد
    const blocks = parseBlocks(css);

    // 3. تصنيف: عادي / @-rule
    const normalBlocks = [];
    const atRules = [];
    blocks.forEach(b => {
      if (b.selector.startsWith('@')) atRules.push(b);
      else normalBlocks.push(b);
    });

    // 4. دمج القواعد بنفس السيلكتور
    const merged = {};
    const order = [];
    let mergedCount = 0;
    normalBlocks.forEach(b => {
      const sel = b.selector;
      if (merged[sel]) {
        merged[sel].body = (merged[sel].body.trim() + '\n' + b.body.trim()).trim();
        mergedCount++;
      } else {
        merged[sel] = { selector: sel, body: b.body.trim() };
        order.push(sel);
      }
    });

    // 5. حذف القواعد الفارغة
    let emptyRemoved = 0;
    const finalBlocks = [];
    order.forEach(sel => {
      const b = merged[sel];
      const props = b.body.replace(/\s+/g, '').replace(/;/g, '');
      if (props.length === 0) { emptyRemoved++; return; }
      finalBlocks.push(b);
    });

    // 6. ترتيب النهائي: القواعد العادية + @-rules في الآخر
    let output = finalBlocks.map(b => b.selector + '{' + b.body + '}').join('\n');
    if (atRules.length > 0) {
      output += '\n\n' + atRules.map(b => b.raw).join('\n\n');
    }

    // 7. تنظيف المسافات الزائدة
    output = output.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    cleanedCSS = output;

    // 8. إحصائيات
    const newSize = cleanedCSS.length;
    const savedKB = ((originalSize - newSize) / 1024).toFixed(2);

    report.innerHTML = `
      <div class="report">
        <h2 style="margin-top:0">📊 التقرير</h2>
        <div class="item"><span>📥 الحجم الأصلي</span><span>${(originalSize/1024).toFixed(1)} KB</span></div>
        <div class="item"><span>📤 الحجم النظيف</span><span class="val">${(newSize/1024).toFixed(1)} KB</span></div>
        <div class="item"><span>💾 التوفير</span><span class="val">${savedKB} KB (${((originalSize-newSize)/originalSize*100).toFixed(1)}%)</span></div>
        <h2>🗑️ ما تم حذفه/دمجه</h2>
        <div class="item"><span>قواعد عادية</span><span>${normalBlocks.length}</span></div>
        <div class="item"><span>قواعد مدموجة</span><span class="badge blue">${mergedCount}</span></div>
        <div class="item"><span>قواعد فارغة محذوفة</span><span class="badge">${emptyRemoved}</span></div>
        <div class="item"><span>@-rules محفوظة</span><span class="badge green">${atRules.length}</span></div>
        <details>
          <summary>👁️ عاين أول 500 حرف من النسخة الجديدة</summary>
          <div class="code-preview">${escapeHTML(cleanedCSS.substring(0, 500))}...</div>
        </details>
      </div>
    `;
    document.getElementById('dlBtn').style.display = 'block';
  } catch(e) {
    report.innerHTML = '<div class="report" style="color:#ff453a;">❌ ' + e.message + '</div>';
  } finally {
    btn.disabled = false;
  }
}

/* محلل CSS: كيقرا القواعد من المستوى الأول فقط (top-level) */
function parseBlocks(css) {
  const blocks = [];
  let i = 0;
  let depth = 0;
  let start = 0;
  while (i < css.length) {
    const c = css[i];
    if (c === '{') {
      if (depth === 0) {
        const selector = css.slice(start, i).trim();
        if (selector) {
          let j = i + 1;
          let d = 1;
          let inStr = null;
          while (j < css.length && d > 0) {
            const cc = css[j];
            if (inStr) {
              if (cc === '\\') { j += 2; continue; }
              if (cc === inStr) inStr = null;
            } else if (cc === '"' || cc === "'") inStr = cc;
            else if (cc === '{') d++;
            else if (cc === '}') d--;
            if (d === 0) break;
            j++;
          }
          const body = css.slice(i + 1, j);
          blocks.push({ selector, body, raw: selector + '{' + body + '}' });
          start = j + 1;
          i = j + 1;
          continue;
        }
      }
      depth++;
    } else if (c === '}') {
      depth--;
      if (depth === 0) start = i + 1;
    }
    i++;
  }
  return blocks;
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function dl() {
  if (!cleanedCSS) return;
  const blob = new Blob([cleanedCSS], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'style.css';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  document.getElementById('report').innerHTML += '<div class="report" style="color:#32d74b;margin-top:10px;">✅ تم التحميل! ارفعو لـ static/style.css في GitHub و اعمل Commit.</div>';
}
</script>
</body>
</html>
