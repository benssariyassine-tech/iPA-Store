<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iStore IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ملف التنسيقات مع رقم الإصدار لمنع الكاش -->
    <link rel="stylesheet" href="/static/style.css?v=2">

    <!-- مكتبات Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-header">
        <div class="burger-menu-btn" onclick="toggleSideMenu()">
            <div class="burger-line"></div>
            <div class="burger-line"></div>
            <div class="burger-line"></div>
        </div>
        <h1 class="header-title">اليوم</h1>
        <div class="search-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div id="sideMenuOverlay" class="side-menu-overlay" onclick="toggleSideMenu()"></div>
    <div id="sideMenu" class="side-menu">
        <div class="side-menu-header">
            <h2>القائمة الرئيسية</h2>
            <button class="close-btn" onclick="toggleSideMenu()">✕</button>
        </div>
        <div class="menu-list">
            <div class="menu-item" onclick="openAuthModal(); toggleSideMenu();">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 10px; vertical-align: middle;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>تسجيل الدخول / حساب جديد</span>
            </div>
        </div>
    </div>

    <!-- حاوية عرض التطبيقات -->
    <div class="main-content">
        <h2 class="section-title">أبرز التحديثات</h2>
        <div id="appsContainer" class="apps-list">
            <p style="text-align:center; color:#8e8e93; padding: 20px;">جاري تحميل التطبيقات...</p>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول المنبثقة -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="authTitle">تسجيل الدخول</h2>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <input type="email" id="authEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="authPassword" placeholder="كلمة المرور" required>
                <button type="submit" id="authSubmitBtn" class="btn-primary">تسجيل الدخول</button>
            </form>
            <div style="margin-top: 15px; text-align: center;">
                <span id="authToggleText">ليس لديك حساب؟</span>
                <a href="#" id="authToggleBtn" onclick="toggleAuthMode(event)" style="color: #0a84ff; text-decoration: none; font-weight: bold;">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <!-- استدعاء ملف البرمجة -->
    <script src="/static/script.js?v=2"></script>
</body>
</html>
