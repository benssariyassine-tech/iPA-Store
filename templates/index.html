<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تطبيقات IPA</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            color: #007aff;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .app-card {
            background-color: #1c1c1e;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
        }
        .app-details h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .app-details p {
            margin: 0;
            font-size: 12px;
            color: #8e8e93;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-size {
            font-size: 11px;
            color: #34c759;
            margin-top: 4px;
        }
        .download-btn {
            background-color: #34c759;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>متجر تطبيقات الآيفون (IPA) 🍏</h1>

    <div id="apps-container">
        <p style="text-align: center; color: #8e8e93;">جاري تحميل التطبيقات...</p>
    </div>

    <script>
        fetch('/api/apps')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('apps-container');
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align: center;">لا توجد تطبيقات متاحة حالياً.</p>';
                    return;
                }

                data.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <div class="app-info">
                            <img src="${app.icon}" class="app-icon" alt="${app.title}">
                            <div class="app-details">
                                <h3>${app.title}</h3>
                                <p>${app.description}</p>
                                <div class="app-size">${app.size} • ${app.version}</div>
                            </div>
                        </div>
                        <a href="${app.download_url}" class="download-btn" target="_blank">تنزيل</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('apps-container').innerHTML = '<p style="text-align: center; color: #ff3b30;">حدث خطأ في تحميل البيانات.</p>';
            });
    </script>
</body>
</html>
