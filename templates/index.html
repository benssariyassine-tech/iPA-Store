<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iStore IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #000000;
            border-bottom: 1px solid #1c1c1e;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; margin: 0; font-weight: 800; }
        
        .user-avatar-btn {
            width: 38px;
            height: 38px;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a84ff;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            overflow: hidden;
        }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section-title { font-size: 17px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .app-card {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 6px; }
        .app-info p { margin: 0; font-size: 13px; color: #8e8e93; }
        .pro-badge {
            background: linear-gradient(135deg, #ff9500, #ffcc00);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .actions-group { display: flex; gap: 8px; align-items: center; }
        .install-btn {
            background: #0a84ff;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .delete-btn {
            background: #ff453a;
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: none; /* تظهر فقط للأدمن */
        }
        .admin-add-btn {
            background: #32d74b;
            color: #000;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: none; /* تظهر فقط للأدمن */
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 340px;
            box-sizing: border-box;
            text-align: center;
        }
        .google-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 20px;
        }
        .close-modal {
            background: #2c2c2e;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
        }
        .admin-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            color: #fff;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="header">
        <h1>iStore IPA</h1>
        <div class="user-avatar-btn" id="userAvatarBtn" onclick="openAccountModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
    </div>

    <div class="container">
        <div class="section-title">
            <span>تطبيقات الـ Pro المميزة</span>
            <button class="admin-add-btn" id="adminAddBtn" onclick="openAddAppModal()">+ إضافة تطبيق</button>
        </div>

        <div id="appsListContainer">
            <!-- التطبيقات تظهر هنا ديناميكياً -->
        </div>
    </div>

    <!-- نافذة الحساب -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <div id="loggedOutView">
                <h3 style="margin-top:0; margin-bottom: 20px; color:#fff; font-size:17px;">تسجيل الدخول إلى iStore IPA</h3>
                <button class="google-btn" onclick="loginWithGoogle()">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.15v3.14C3.11 21.36 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.15C.42 8.1 0 9.77 0 11.5s.42 3.4 1.15 4.88l4.12-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.11 2.64 1.15 6.62l4.12 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                    المتابعة بواسطة Google
                </button>
            </div>

            <div id="loggedInView" style="display:none; text-align:center;">
                <h3 style="margin-top:0; color:#0a84ff;" id="userNameText">حسابي</h3>
                <p style="color:#8e8e93; font-size:12px; margin-bottom: 20px;" id="userEmailText"></p>
                <div id="adminBadgeText" style="color: #32d74b; font-weight: bold; font-size: 13px; margin-bottom: 15px; display:none;">👑 أنت مسجل بصفتك الأدمن</div>
                <button class="install-btn" onclick="logoutUser()" style="background:#ff453a; width:100%; margin-bottom: 10px;">تسجيل الخروج</button>
            </div>

            <button class="close-modal" onclick="closeAccountModal()">إغلاق</button>
        </div>
    </div>

    <!-- نافذة إضافة تطبيق للأدمن -->
    <div id="addAppModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#fff; font-size:16px;">إضافة تطبيق IPA جديد</h3>
            <input type="text" id="appNameInput" class="admin-input" placeholder="اسم التطبيق (مثال: يوتيوب بلس)">
            <input type="text" id="appDescInput" class="admin-input" placeholder="الوصف (مثال: بدون إعلانات)">
            <input type="text" id="appUrlInput" class="admin-input" placeholder="رابط التحميل (.ipa)">
            <button class="install-btn" onclick="addNewApp()" style="width:100%; margin-bottom:10px; background:#32d74b; color:#000;">حفظ ونشر</button>
            <button class="close-modal" onclick="closeAddAppModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC3r9wr8tgjRNwWFY01mxrVy640sQFs2bg",
          authDomain: "istore-ipa.firebaseapp.com",
          projectId: "istore-ipa",
          storageBucket: "istore-ipa.firebasestorage.app",
          messagingSenderId: "262724812706",
          appId: "1:262724812706:web:b9fae4bb87f0417f557cfb"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        const ADMIN_EMAIL = "benssariyassine@gmail.com";
        let isAdmin = false;

        // قائمة التطبيقات الافتراضية أو المخزنة
        let appsData = JSON.parse(localStorage.getItem('istore_apps')) || [
            { name: "يوتيوب بلس", desc: "بدون إعلانات - تشغيل بالخلفية", url: "#" }
        ];

        function renderApps() {
            const container = document.getElementById('appsListContainer');
            container.innerHTML = '';
            
            appsData.forEach((app, index) => {
                container.innerHTML += `
                    <div class="app-card">
                        <div class="app-info">
                            <h3>${app.name} <span class="pro-badge">PRO</span></h3>
                            <p>${app.desc}</p>
                        </div>
                        <div class="actions-group">
                            <a href="${app.url}" class="install-btn" onclick="event.preventDefault(); alert('جارٍ بدء التثبيت...');">تثبيت</a>
                            <button class="delete-btn" id="del-btn-${index}" onclick="deleteApp(${index})" style="display: ${isAdmin ? 'block' : 'none'};">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function openAccountModal() { document.getElementById('accountModal').style.display = 'flex'; }
        function closeAccountModal() { document.getElementById('accountModal').style.display = 'none'; }
        
        function openAddAppModal() { document.getElementById('addAppModal').style.display = 'flex'; }
        function closeAddAppModal() { document.getElementById('addAppModal').style.display = 'none'; }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(() => {
                auth.signInWithRedirect(provider);
            });
        }

        auth.getRedirectResult().catch(err => console.log(err));

        auth.onAuthStateChanged((user) => {
            const addBtn = document.getElementById('adminAddBtn');
            const adminBadge = document.getElementById('adminBadgeText');

            if (user) {
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'block';
                document.getElementById('userNameText').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('userEmailText').innerText = user.email;
                document.getElementById('userAvatarBtn').innerText = user.email.charAt(0).toUpperCase();

                // التحقق من صلاحيات الأدمن بدقة
                if (user.email.toLowerCase() === ADMIN_EMAIL) {
                    isAdmin = true;
                    addBtn.style.display = 'block';
                    adminBadge.style.display = 'block';
                } else {
                    isAdmin = false;
                    addBtn.style.display = 'none';
                    adminBadge.style.display = 'none';
                }
            } else {
                isAdmin = false;
                document.getElementById('loggedOutView').style.display = 'block';
                document.getElementById('loggedInView').style.display = 'none';
                document.getElementById('userAvatarBtn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
                addBtn.style.display = 'none';
                adminBadge.style.display = 'none';
            }
            renderApps();
        });

        function addNewApp() {
            if (!isAdmin) return;
            const name = document.getElementById('appNameInput').value;
            const desc = document.getElementById('appDescInput').value;
            const url = document.getElementById('appUrlInput').value || '#';

            if (!name) {
                alert('الرجاء إدخال اسم التطبيق على الأقل');
                return;
            }

            appsData.push({ name, desc, url });
            localStorage.setItem('istore_apps', JSON.stringify(appsData));
            
            document.getElementById('appNameInput').value = '';
            document.getElementById('appDescInput').value = '';
            document.getElementById('appUrlInput').value = '';
            
            closeAddAppModal();
            renderApps();
        }

        function deleteApp(index) {
            if (!isAdmin) return;
            if (confirm('هل أنت متأكد من حذف هذا التطبيق؟')) {
                appsData.splice(index, 1);
                localStorage.setItem('istore_apps', JSON.stringify(appsData));
                renderApps();
            }
        }

        function logoutUser() {
            auth.signOut().then(() => {
                closeAccountModal();
            });
        }

        // تشغيل أولى لعرض القائمة
        renderApps();
    </script>
</body>
</html>
