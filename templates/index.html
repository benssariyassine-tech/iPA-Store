<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iStore IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0 0 110px 0;
            direction: rtl;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(11, 11, 15, 0.9);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; letter-spacing: 0.5px; }
        .logo-area span { color: #0a84ff; }
        
        .header-icons { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            background: #1c1c24;
            border: 1px solid rgba(255,255,255,0.08);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }

        .container { padding: 16px 20px; max-width: 600px; margin: auto; animation: fadeInUp 0.3s ease; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* شريط البحث الاحترافي */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            background: #16161c;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px 45px 12px 15px;
            border-radius: 16px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-input:focus { border-color: #0a84ff; }
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
            width: 18px;
            height: 18px;
        }

        .today-header { margin-bottom: 15px; animation: fadeInUp 0.4s ease; }
        .today-date { color: #8e8e93; font-size: 12px; font-weight: 600; }
        .today-title { font-size: 28px; font-weight: 900; margin: 2px 0; }
        .today-subtitle { font-size: 13px; color: #ff9f0a; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        .featured-card {
            background: #16161c;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .featured-img { width: 100%; height: 190px; object-fit: cover; }
        .featured-body { padding: 16px; }
        .badge-tag { background: rgba(255,159,10,0.15); color: #ff9f0a; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
        
        .section-heading { font-size: 17px; font-weight: 800; margin: 20px 0 12px 0; display: flex; justify-content: space-between; align-items: center; }
        
        /* كارد التطبيق */
        .app-card-pro {
            background: #16161c;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-meta { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; cursor: pointer; }
        .app-icon-img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
        .app-details h4 { margin: 0 0 3px 0; font-size: 14px; font-weight: 700; color: #fff; }
        .app-details p { margin: 0; font-size: 12px; color: #8e8e93; }
        
        .app-actions { display: flex; gap: 8px; align-items: center; }
        .btn-install {
            background: linear-gradient(135deg, #0a84ff, #0062d2);
            color: #fff;
            padding: 7px 15px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            border: none;
            box-shadow: 0 4px 12px rgba(10,132,255,0.3);
            white-space: nowrap;
        }
        .admin-btns { display: flex; gap: 4px; }
        .btn-edit { background: #ff9f0a; color: #fff; padding: 5px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; }
        .btn-del { background: #ff453a; color: #fff; padding: 5px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; }

        /* القائمة السفلية العائمة الواضحة */
        .floating-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            background: rgba(22, 22, 28, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .nav-item {
            background: none;
            border: none;
            color: #a1a1a6;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.25s;
        }
        .nav-item.active { color: #0a84ff; transform: scale(1.05); }
        .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        /* النافذة المنبثقة Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-box { background: #16161c; border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; padding: 22px; width: 88%; max-width: 360px; max-height: 85vh; overflow-y: auto; box-sizing: border-box; }
        .input-field { width: 100%; padding: 11px; margin-bottom: 10px; background: #0b0b0f; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; box-sizing: border-box; font-family: 'Cairo', sans-serif; font-size: 13px; outline: none; }
        select.input-field { appearance: none; }
        
        .admin-add-float {
            position: fixed;
            bottom: 78px;
            left: 20px;
            background: #32d74b;
            color: #000;
            padding: 9px 16px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(50,215,75,0.4);
            cursor: pointer;
            z-index: 999;
            display: none;
        }

        /* صفحة تفاصيل التطبيق والتعليقات والتقييمات */
        .detail-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .detail-icon { width: 75px; height: 75px; border-radius: 18px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .star-rating { color: #ff9f0a; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 4px; margin: 6px 0; }
        .comment-box { background: #0b0b0f; border: 1px solid rgba(255,255,255,0.06); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 12px; }
        .comment-user { color: #0a84ff; font-weight: 700; margin-bottom: 3px; }
        
        /* قسم الأدوات وشرح E-Sign */
        .tool-guide-card {
            background: #16161c;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .tool-guide-card h3 { color: #32d74b; margin-top: 0; font-size: 16px; }
        .tool-guide-card p { color: #a1a1a6; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <svg width="20" height="20" viewBox="0 0 170 170" fill="#0a84ff"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.1-1.9-14.24-6.08-3.05-2.61-6.91-7.2-11.58-13.78-6.1-8.57-11.05-18.15-14.85-28.74-3.8-10.59-5.7-20.73-5.7-30.43 0-11.58 3.02-21.2 9.07-28.85 6.04-7.65 13.68-11.54 22.9-11.66 4.9 0 10.15 1.3 15.76 3.9 5.6 2.61 9.3 3.91 11.1 3.91 1.52 0 5.37-1.38 11.55-4.14 6.18-2.76 11.45-4.04 15.82-3.85 10.36.76 18.57 5.04 24.63 12.83-9.35 5.72-13.93 13.43-13.73 23.15.22 7.6 3.14 13.88 8.77 18.83 5.62 4.95 12.44 7.55 20.45 7.82-1.85 5.66-4.14 11.31-6.88 16.97zM119.22 31.33c0-7.39 2.68-14.25 8.04-20.58 5.36-6.33 12.18-10.23 20.45-11.72.11.87.16 1.69.16 2.47 0 7.18-2.83 14.28-8.5 23.3-5.66 9.02-12.39 13.6-20.15 13.73-.01-.89-.01-1.78 0-3.2z"/></svg>

        <div class="header-icons">
            <div class="icon-btn" onclick="openAccountModal()" title="حساب المستخدم">

            </div>
        </div>
    </div>

    <div class="container">
        <!-- شريط البحث الفوري -->
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن أي تطبيق، لعبة أو أداة..." oninput="filterAppsSearch()">
        </div>

        <div id="dynamicContent">
            <!-- المحتوى يتغير حسب التبويب -->
        </div>
    </div>

    <button class="admin-add-float" id="adminAddFloatBtn" onclick="openAddAppModal()">+ إضافة تطبيق جديد</button>

    <!-- القائمة السفلية العائمة -->
    <div class="floating-nav">
        <button class="nav-item active" onclick="switchTab('today', this)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            اليوم
        </button>
        <button class="nav-item" onclick="switchTab('games', this)">
            <svg viewBox="0 0 24 24"><path d="M6 11h4m-2-2v4m10-2a2 2 0 11-4 0 2 2 0 014 0zm-4 4a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            الألعاب
        </button>
        <button class="nav-item" onclick="switchTab('apps', this)">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            التطبيقات
        </button>
        <button class="nav-item" onclick="switchTab('tools', this)">
            <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            الأدوات
        </button>
    </div>

    <!-- نافذة الحساب وتسجيل الدخول العامة -->
    <div id="accountModal" class="modal">
        <div class="modal-box" style="text-align: center;">
            <div id="loggedOutView">
                <h3 style="margin-top:0; color:#fff; font-size:16px;">حساب المستخدم</h3>
                <p style="color:#8e8e93; font-size:12px; margin-bottom:15px;">سجل الدخول بحسابك لتقييم التطبيقات وكتابة التعليقات.</p>
                <button onclick="loginWithGoogle()" style="background:#fff; color:#000; border:none; width:100%; padding:11px; border-radius:12px; font-weight:bold; cursor:pointer; font-family:'Cairo',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.16 21.39 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.12 0 9.81 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.16 2.61 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                    تسجيل الدخول بـ Google
                </button>
            </div>
            <div id="loggedInView" style="display:none;">
                <h3 id="userEmailText" style="color:#32d74b; font-size:12px; margin-bottom:8px; word-break: break-all;"></h3>
                <p id="adminBadge" style="color:#0a84ff; font-size:12px; font-weight:bold; margin-bottom:15px; display:none;">👑 أنت الأدمن المسؤول عن المتجر</p>
                <button onclick="auth.signOut()" style="background:#ff453a; color:#fff; border:none; width:100%; padding:10px; border-radius:10px; font-weight:bold; cursor:pointer;">تسجيل الخروج</button>
            </div>
            <button onclick="document.getElementById('accountModal').style.display='none'" style="background:#2c2c2e; color:#fff; border:none; width:100%; padding:10px; border-radius:10px; margin-top:12px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <!-- نافذة إضافة أو تعديل تطبيق -->
    <div id="addAppModal" class="modal">
        <div class="modal-box">
            <h3 id="modalTitleText" style="margin-top:0; color:#fff; font-size:16px;">إضافة تطبيق للسحابة</h3>
            <input type="hidden" id="editingAppId">
            <div style="font-size:11px; color:#8e8e93; margin-bottom:4px;">اختر القسم:</div>

                <option value="today">قسم اليوم (واجهة رئيسية مميزة)</option>

                <option value="apps">قسم التطبيقات</option>
                <option value="tools">قسم الأدوات</option>

            <div style="font-size:11px; color:#8e8e93; margin-bottom:4px;">أيقونة التطبيق (صورة):</div>
            <input type="file" id="appImgFile" class="input-field" accept="image/*">
            <input type="text" id="appName" class="input-field" placeholder="اسم التطبيق (مثال: GTA San Andreas)">
            <input type="text" id="appDesc" class="input-field" placeholder="الوصف أو الحجم (مثال: Action • 2.1 GB)">
            <input type="text" id="appUrl" class="input-field" placeholder="رابط التحميل المباشر (.ipa)">
            <button onclick="saveNewApp()" style="background:#32d74b; color:#000; border:none; width:100%; padding:11px; border-radius:12px; font-weight:bold; cursor:pointer; font-family:'Cairo',sans-serif;">حفظ ونشر فوري</button>
            <button onclick="document.getElementById('addAppModal').style.display='none'" style="background:#2c2c2e; color:#fff; border:none; width:100%; padding:10px; border-radius:10px; margin-top:8px; cursor:pointer;">إلغاء</button>

    </div>

    <!-- نافذة تفاصيل التطبيق، التقييمات، والتعليقات -->
    <div id="appDetailModal" class="modal">
        <div class="modal-box" id="appDetailBody">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- نافذة الإبلاغ عن مشكلة -->
    <div id="reportModal" class="modal">
        <div class="modal-box">
            <h3 style="margin-top:0; color:#fff; font-size:16px;">إبلاغ عن رابط لا يعمل أو مشكلة</h3>
            <input type="hidden" id="reportAppId">
            <textarea id="reportReason" class="input-field" placeholder="اكتب تفاصيل المشكلة (مثال: رابط التحميل منتهٍ)..." style="height:80px; resize:none;"></textarea>
            <button onclick="submitReport()" style="background:#ff9f0a; color:#000; border:none; width:100%; padding:11px; border-radius:12px; font-weight:bold; cursor:pointer; font-family:'Cairo',sans-serif;">إرسال البلاغ للأدمن</button>
            <button onclick="document.getElementById('reportModal').style.display='none'" style="background:#2c2c2e; color:#fff; border:none; width:100%; padding:10px; border-radius:10px; margin-top:8px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC3r9wr8tgjRNwWFY01mxrVy640sQFs2bg",
          authDomain: "istore-ipa.firebaseapp.com",
          projectId: "istore-ipa",
          storageBucket: "istore-ipa.firebasestorage.app",
          messagingSenderId: "262724812706",
          appId: "1:262724812706:web:b9fae4bb87f0417f557cfb"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_EMAIL = "benssariyassine@gmail.com";
        let currentUser = null;
        let isAdmin = false;
        let currentTab = 'today';
        let allAppsCache = [];

        // الحصول على التاريخ الفعلي الحقيقي بالعربية
        function getActualDateString() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('ar-DZ', options);
        }

        function switchTab(tabName, btnElement) {
            currentTab = tabName;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderUI();
        }

        // جلب التطبيقات بشكل حي من سحابة فايرباس
        db.collection("apps").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            allAppsCache = [];
            snapshot.forEach(doc => {
                allAppsCache.push({ id: doc.id, ...doc.data() });
            });
            renderUI();
        });

        function filterAppsSearch() {
            renderUI();
        }

        function renderUI() {
            const container = document.getElementById('dynamicContent');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allAppsCache;
            if (searchQuery.trim() !== "") {
                filtered = allAppsCache.filter(app => app.name.toLowerCase().includes(searchQuery) || app.desc.toLowerCase().includes(searchQuery));
                container.innerHTML = `<div class="section-heading">نتائج البحث (${filtered.length})</div><div id="searchResContainer"></div>`;
                const sContainer = document.getElementById('searchResContainer');
                if(filtered.length === 0) {
                    sContainer.innerHTML = `<p style="color:#8e8e93; text-align:center; font-size:13px; margin-top:30px;">لا توجد تطبيقات مطابقة لبحثك.</p>`;
                } else {
                    filtered.forEach(app => sContainer.innerHTML += createAppCardHTML(app));
                }
                return;
            }

            if (currentTab === 'today') {
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-date">${getActualDateString()}</div>
                        <div class="today-title">اليوم</div>
                        <div class="today-subtitle">🔥 تحديثات وأحداث خاصة</div>
                    </div>
                    <div id="todayAppsContainer"></div>
                    <div class="section-heading">القائمة العامة</div>
                    <div id="generalAppsContainer"></div>
                `;
                
                const todayList = allAppsCache.filter(app => app.category === 'today' || !app.category);
                const generalList = allAppsCache.filter(app => app.category && app.category !== 'today');

                const tContainer = document.getElementById('todayAppsContainer');
                if (todayList.length === 0) {
                    tContainer.innerHTML = `<p style="color:#8e8e93; font-size:13px; text-align:center;">لا توجد تطبيقات مميزة في قسم اليوم حالياً.</p>`;
                } else {
                    todayList.forEach(app => {
                        let avgRating = app.ratingCount ? (app.ratingSum / app.ratingCount).toFixed(1) : 0;
                        tContainer.innerHTML += `
                            <div class="featured-card">
                                <img src="${app.icon || 'https://via.placeholder.com/300'}" class="featured-img" style="cursor:pointer;" onclick="openAppDetails('${app.id}')">
                                <div class="featured-body">
                                    <span class="badge-tag">تطبيق اليوم المميز • ⭐ ${avgRating}</span>
                                    <h3 style="margin:5px 0 4px 0; font-size:17px; cursor:pointer;" onclick="openAppDetails('${app.id}')">${app.name}</h3>
                                    <p style="color:#8e8e93; font-size:12px; margin:0 0 14px 0;">${app.desc}</p>
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <a href="${app.url}" class="btn-install" target="_blank">تثبيت فوري</a>
                                        <div style="display:flex; gap:6px;">
                                            <button onclick="openReportModal('${app.id}')" style="background:#2c2c2e; color:#ff9f0a; border:none; padding:5px 9px; border-radius:8px; font-size:10px; cursor:pointer;">إبلاغ</button>
                                            ${isAdmin ? `<div class="admin-btns"><button class="btn-edit" onclick="openEditAppModal('${app.id}')">تعديل</button><button class="btn-del" onclick="deleteApp('${app.id}')">حذف</button></div>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                const gContainer = document.getElementById('generalAppsContainer');
                if (generalList.length === 0) {
                    gContainer.innerHTML = `<p style="color:#8e8e93; font-size:13px; text-align:center;">لا توجد تطبيقات أخرى متاحة حالياً.</p>`;
                } else {
                    generalList.forEach(app => gContainer.innerHTML += createAppCardHTML(app));
                }

            } else if (currentTab === 'tools') {
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">أدوات التثبيت والجلبريك</div>
                        <div class="today-subtitle">دليل رسمي لاستخدام متجر وبرامج التوقيع</div>
                    </div>
                    <div style="margin-top:15px;">
                        <div class="tool-guide-card">
                            <h3>تطبيق E-Sign (توقيع الشهادات)</h3>
                            <p>يعتبر برنامج <strong>E-Sign</strong> من أفضل أدوات تثبيت وتوقيع ملفات الـ IPA مباشرة على آيفونك بدون كمبيوتر، باستخدام شهادات التوزيع (Enterprise Certificates).</p>
                            <p><strong>طريقة الاستخدام:</strong><br>1. حمل شهادة التطبيق الموثوقة.<br>2. ثبت برنامج E-Sign من الروابط الرسمية.<br>3. ادخل للبرنامج، اضغط على زر الإعدادات ثم استيراد ملف الـ IPA الذي حملته من متجرنا لتثبيته بنجاح.</p>
                        </div>
                        <div class="tool-guide-card">
                            <h3>تطبيق Scarlet أو TrollStore</h3>
                            <p>بدائل قوية لتثبيت التطبيقات الموقعة، تمنحك استقراراً تاماً وتجنبك مشاكل توقف الشهادات المتكررة إذا كان جهازك يدعم إصداراً مناسباً.</p>
                        </div>
                    </div>
                `;
            } else {
                const tabFiltered = allAppsCache.filter(app => app.category === currentTab);
                const titles = { games: 'ألعاب الآيفون', apps: 'التطبيقات المميزة' };
                
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">${titles[currentTab] || 'التطبيقات'}</div>
                        <div class="today-subtitle">مكتبة IPA محدثة باستمرار</div>
                    </div>
                    <div style="margin-top:15px;" id="filteredContainer"></div>
                `;
                
                const fContainer = document.getElementById('filteredContainer');
                if (tabFiltered.length === 0) {
                    fContainer.innerHTML = `<p style="color:#8e8e93; font-size:13px; text-align:center; margin-top:40px;">لا توجد تطبيقات في هذا القسم حالياً.</p>`;
                } else {
                    tabFiltered.forEach(app => fContainer.innerHTML += createAppCardHTML(app));
                }
            }
        }

        function createAppCardHTML(app) {
            let avgRating = app.ratingCount ? (app.ratingSum / app.ratingCount).toFixed(1) : 0;
            return `
                <div class="app-card-pro">
                    <div class="app-meta" onclick="openAppDetails('${app.id}')">
                        <img src="${app.icon || 'https://via.placeholder.com/60'}" class="app-icon-img">
                        <div class="app-details">
                            <h4>${app.name}</h4>
                            <p>${app.desc} • ⭐ ${avgRating}</p>
                        </div>
                    </div>
                    <div class="app-actions">
                        <a href="${app.url}" class="btn-install" target="_blank">تثبيت</a>
                        <button onclick="openReportModal('${app.id}')" style="background:#2c2c2e; color:#ff9f0a; border:none; padding:6px 8px; border-radius:10px; font-size:10px; cursor:pointer;" title="إبلاغ">⚠️</button>
                        ${isAdmin ? `<div class="admin-btns"><button class="btn-edit" onclick="openEditAppModal('${app.id}')">تعديل</button><button class="btn-del" onclick="deleteApp('${app.id}')">حذف</button></div>` : ''}
                    </div>
                </div>
            `;
        }

        // تفاصيل التطبيق والتعليقات والتقييمات الحقيقية
        function openAppDetails(appId) {
            const app = allAppsCache.find(a => a.id === appId);
            if (!app) return;
            
            let avgRating = app.ratingCount ? (app.ratingSum / app.ratingCount).toFixed(1) : 0;
            let commentsHTML = '';
            
            db.collection("apps").doc(appId).collection("comments").orderBy("createdAt", "desc").get().then(snapshot => {
                let commentsList = [];
                snapshot.forEach(doc => commentsList.push(doc.data()));
                
                if(commentsList.length === 0) {
                    commentsHTML = `<p style="color:#8e8e93; font-size:12px; text-align:center;">0 تعليقات حتى الآن. كن اول من يعلق!</p>`;
                } else {
                    commentsList.forEach(c => {
                        commentsHTML += `
                            <div class="comment-box">
                                <div class="comment-user">${c.userName}</div>
                                <div>${c.text}</div>
                            </div>
                        `;
                    });
                }

                document.getElementById('appDetailBody').innerHTML = `
                    <div class="detail-header">
                        <img src="${app.icon || 'https://via.placeholder.com/75'}" class="detail-icon">
                        <div>
                            <h3 style="margin:0 0 4px 0; font-size:16px; color:#fff;">${app.name}</h3>
                            <p style="margin:0; font-size:12px; color:#8e8e93;">${app.desc}</p>
                            <div class="star-rating">⭐ ${avgRating} <span style="font-size:11px; color:#8e8e93;">(${app.ratingCount || 0} تقييم)</span></div>
                        </div>
                    </div>
                    <a href="${app.url}" class="btn-install" style="display:block; text-align:center; padding:10px; margin-bottom:15px;" target="_blank">تحميل وتثبيت مباشر (.ipa)</a>
                    
                    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:12px; margin-bottom:12px;">
                        <h4 style="font-size:13px; margin:0 0 8px 0; color:#fff;">قيم هذا التطبيق:</h4>
                        <div style="display:flex; gap:10px; justify-content:center;">
                            <button onclick="rateApp('${app.id}', 1)" style="background:#1c1c24; border:1px solid #ff9f0a; color:#fff; padding:5px 12px; border-radius:8px; cursor:pointer;">⭐ 1</button>
                            <button onclick="rateApp('${app.id}', 3)" style="background:#1c1c24; border:1px solid #ff9f0a; color:#fff; padding:5px 12px; border-radius:8px; cursor:pointer;">⭐⭐⭐ 3</button>
                            <button onclick="rateApp('${app.id}', 5)" style="background:#1c1c24; border:1px solid #ff9f0a; color:#fff; padding:5px 12px; border-radius:8px; cursor:pointer;">⭐⭐⭐⭐⭐ 5</button>
                        </div>
                    </div>

                    <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:12px;">
                        <h4 style="font-size:13px; margin:0 0 8px 0; color:#fff;">التعليقات (${commentsList.length}):</h4>
                        <div style="max-height:140px; overflow-y:auto; margin-bottom:10px;" id="commentsListArea">
                            ${commentsHTML}
                        </div>
                        ${currentUser ? `
                            <input type="text" id="newCommentText" class="input-field" placeholder="اكتب تعليقاً..." style="margin-bottom:6px;">
                            <button onclick="postComment('${app.id}')" style="background:#0a84ff; color:#fff; border:none; width:100%; padding:8px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px;">إرسال التعليق</button>
                        ` : `<p style="color:#ff9f0a; font-size:11px; text-align:center;">سجل دخولك عبر زر الحساب بالأعلى لتتمكن من التعليق.</p>`}
                    </div>
                    
                    <button onclick="document.getElementById('appDetailModal').style.display='none'" style="background:#2c2c2e; color:#fff; border:none; width:100%; padding:9px; border-radius:10px; margin-top:15px; cursor:pointer;">إغلاق</button>
                `;
                document.getElementById('appDetailModal').style.display = 'flex';
            });
        }

        // التقييم الفعلي (لا توهم)
        function rateApp(appId, stars) {
            if (!currentUser) { alert('الرجاء تسجيل الدخول أولاً للتقييم'); return; }
            const appRef = db.collection("apps").doc(appId);
            db.runTransaction(transaction => {
                return transaction.get(appRef).then(doc => {
                    if (!doc.exists) return;
                    let data = doc.data();
                    let newSum = (data.ratingSum || 0) + stars;
                    let newCount = (data.ratingCount || 0) + 1;
                    transaction.update(appRef, { ratingSum: newSum, ratingCount: newCount });
                });
            }).then(() => {
                alert('شكراً لك، تم تسجيل تقييمك بنجاح!');
                openAppDetails(appId);
            }).catch(err => alert("خطأ: " + err.message));
        }

        // نشر تعليق حقيقي
        function postComment(appId) {
            if (!currentUser) { alert('سجل دخولك أولاً'); return; }
            const text = document.getElementById('newCommentText').value.trim();
            if (!text) return;

            db.collection("apps").doc(appId).collection("comments").add({
                userName: currentUser.email.split('@')[0],
                text: text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('newCommentText').value = '';
                openAppDetails(appId);
            });
        }

        // إبلاغ عن مشكلة
        function openReportModal(appId) {
            document.getElementById('reportAppId').value = appId;
            document.getElementById('reportReason').value = '';
            document.getElementById('reportModal').style.display = 'flex';
        }

        function submitReport() {
            const appId = document.getElementById('reportAppId').value;
            const reason = document.getElementById('reportReason').value.trim();
            if (!reason) { alert('اكتب سبب الإبلاغ من فضلك'); return; }

            db.collection("reports").add({
                appId, reason,
                user: currentUser ? currentUser.email : 'زائر',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('تم إرسال بلاغك للإدارة بنجاح. شكراً لمساهمتك!');
                document.getElementById('reportModal').style.display = 'none';
            });
        }

        // المصادقة والتحقق من حساب الأدمن
        auth.onAuthStateChanged(user => {
            currentUser = user;
            const floatBtn = document.getElementById('adminAddFloatBtn');
            const adminBadge = document.getElementById('adminBadge');
            
            if (user) {
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'block';
                document.getElementById('userEmailText').innerText = user.email;
                
                if (user.email.toLowerCase() === ADMIN_EMAIL) {
                    isAdmin = true;
                    floatBtn.style.display = 'block';
                    adminBadge.style.display = 'block';
                } else {
                    isAdmin = false;
                    floatBtn.style.display = 'none';
                    adminBadge.style.display = 'none';
                }
            } else {
                isAdmin = false;
                floatBtn.style.display = 'none';
                adminBadge.style.display = 'none';
                document.getElementById('loggedOutView').style.display = 'block';
                document.getElementById('loggedInView').style.display = 'none';
            }
            renderUI();
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(() => auth.signInWithRedirect(provider));
        }

        function openAccountModal() { document.getElementById('accountModal').style.display = 'flex'; }
        
        function openAddAppModal() {
            if (!isAdmin) return;
            document.getElementById('modalTitleText').innerText = "إضافة تطبيق للسحابة";
            document.getElementById('editingAppId').value = "";
            document.getElementById('appName').value = "";
            document.getElementById('appDesc').value = "";
            document.getElementById('appUrl').value = "";
            document.getElementById('appImgFile').value = "";
            document.getElementById('addAppModal').style.display = 'flex';
        }

        function openEditAppModal(id) {
            if (!isAdmin) return;
            const app = allAppsCache.find(a => a.id === id);
            if (!app) return;
            document.getElementById('modalTitleText').innerText = "تعديل التطبيق أو الـ URL";
            document.getElementById('editingAppId').value = app.id;
            document.getElementById('appCategory').value = app.category || 'today';
            document.getElementById('appName').value = app.name || '';
            document.getElementById('appDesc').value = app.desc || '';
            document.getElementById('appUrl').value = app.url || '';
            document.getElementById('addAppModal').style.display = 'flex';
        }

        function saveNewApp() {
            if (!isAdmin) return;
            const editingId = document.getElementById('editingAppId').value;
            const category = document.getElementById('appCategory').value;
            const name = document.getElementById('appName').value;
            const desc = document.getElementById('appDesc').value;
            const url = document.getElementById('appUrl').value || '#';
            const fileInput = document.getElementById('appImgFile');

            if (!name) { alert('أدخل اسم التطبيق من فضلك'); return; }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    commitAppToCloud(editingId, category, name, desc, url, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                let existingIcon = 'https://via.placeholder.com/60';
                if (editingId) {
                    const found = allAppsCache.find(a => a.id === editingId);
                    if (found) existingIcon = found.icon;
                }
                commitAppToCloud(editingId, category, name, desc, url, existingIcon);
            }
        }

        function commitAppToCloud(editingId, category, name, desc, url, icon) {
            if (editingId) {
                db.collection("apps").doc(editingId).update({
                    category, name, desc, url, icon
                }).then(() => {
                    document.getElementById('addAppModal').style.display = 'none';
                    alert('تم تحديث التطبيق بنجاح!');
                }).catch(err => alert("خطأ: " + err.message));
            } else {
                db.collection("apps").add({
                    category, name, desc, url, icon,
                    ratingSum: 0,
                    ratingCount: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    document.getElementById('appName').value = '';
                    document.getElementById('appDesc').value = '';
                    document.getElementById('appUrl').value = '';
                    document.getElementById('appImgFile').value = '';
                    document.getElementById('addAppModal').style.display = 'none';
                }).catch(err => alert("خطأ: " + err.message));
            }
        }

        function deleteApp(id) {
            if (!isAdmin) return;
            if (confirm('هل أنت متأكد من حذف هذا التطبيق نهائياً من السحابة؟')) {
                db.collection("apps").doc(id).delete();
            }
        }
    </script>
</body>
</html>
