<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iStore IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --text-color: #ffffff;
            --card-bg: #16161c;
            --border-color: rgba(255,255,255,0.08);
            --subtext-color: #8e8e93;
            --header-bg: rgba(11, 11, 15, 0.9);
            --nav-bg: rgba(18, 18, 24, 0.75);
            --modal-bg: #16161c;
            --input-bg: #0b0b0f;
        }

        body.light-mode {
            --bg-color: #f2f2f7;
            --text-color: #000000;
            --card-bg: #ffffff;
            --border-color: rgba(0,0,0,0.08);
            --subtext-color: #636366;
            --header-bg: rgba(242, 242, 247, 0.9);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --modal-bg: #ffffff;
            --input-bg: #f2f2f7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0 0 110px 0;
            direction: ltr;
            transition: background 0.3s, color 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; letter-spacing: 0.5px; }
        .logo-area span { color: #0a84ff; }
        
        .header-icons { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            cursor: pointer;
        }

        .container { padding: 16px 20px; max-width: 600px; margin: auto; animation: fadeInUp 0.3s ease; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px 12px 45px;
            border-radius: 16px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-input:focus { border-color: #0a84ff; }
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--subtext-color);
            width: 18px;
            height: 18px;
        }

        .today-header { margin-bottom: 15px; animation: fadeInUp 0.4s ease; }
        .today-date { color: var(--subtext-color); font-size: 12px; font-weight: 600; }
        .today-title { font-size: 28px; font-weight: 900; margin: 2px 0; }
        .today-subtitle { font-size: 13px; color: #ff453a; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        .featured-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .featured-img { width: 100%; height: 190px; object-fit: cover; }
        .featured-body { padding: 16px; }
        .badge-tag { background: rgba(255,69,58,0.15); color: #ff453a; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
        
        .section-heading { font-size: 17px; font-weight: 800; margin: 20px 0 12px 0; display: flex; justify-content: space-between; align-items: center; }
        
        .app-card-pro {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-meta { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; cursor: pointer; }
        .app-icon-img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border-color); }
        .app-details h4 { margin: 0 0 3px 0; font-size: 14px; font-weight: 700; color: var(--text-color); }
        .app-details p { margin: 0; font-size: 12px; color: var(--subtext-color); }
        .app-category-sub { font-size: 11px; color: var(--subtext-color); font-weight: 600; margin-top: 2px; }
        
        .app-actions { display: flex; gap: 8px; align-items: center; }
        .btn-install {
            background: linear-gradient(135deg, #0a84ff, #0062d2);
            color: #fff;
            padding: 7px 15px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            border: none;
            box-shadow: 0 4px 12px rgba(10,132,255,0.3);
            white-space: nowrap;
            cursor: pointer;
        }
        .admin-btns { display: flex; gap: 4px; }
        .btn-edit { background: #0a84ff; color: #fff; padding: 5px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; }
        .btn-del { background: #ff453a; color: #fff; padding: 5px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; }

        .floating-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--subtext-color);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: 0.25s;
        }
        .nav-item.active { color: #0a84ff; transform: scale(1.08); }
        .nav-item svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; }
        .modal-box { background: var(--modal-bg); border: 1px solid var(--border-color); border-radius: 22px; padding: 22px; width: 88%; max-width: 360px; max-height: 85vh; overflow-y: auto; box-sizing: border-box; position: relative; }
        
        .modal-close-x {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--input-bg);
            border: none;
            color: var(--text-color);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .bottom-sheet-modal {
            display: none;
            position: fixed;
            z-index: 2500;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: flex-end;
            justify-content: center;
        }
        .bottom-sheet-content {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 24px 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
            animation: slideUpSheet 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .screenshots-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin: 12px 0;
            scroll-snap-type: x mandatory;
        }
        .screenshots-container::-webkit-scrollbar { height: 4px; }
        .screenshots-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .screenshot-item {
            width: 130px;
            height: 230px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            scroll-snap-align: start;
        }

        .input-field { width: 100%; padding: 11px; margin-bottom: 10px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-color); box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 13px; outline: none; }
        select.input-field { appearance: none; }
        
        .admin-add-float {
            position: fixed;
            bottom: 84px;
            right: 20px;
            background: #ff453a;
            color: #fff;
            padding: 9px 16px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(255,69,58,0.4);
            cursor: pointer;
            z-index: 999;
            display: none;
        }

        .admin-dashboard-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeInUp 0.4s ease;
        }
        .admin-section-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,69,58,0.25);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
        }
        .stat-box h5 { margin: 0 0 6px 0; color: var(--subtext-color); font-size: 11px; font-weight: 700; }
        .stat-box p { margin: 0; color: #ff453a; font-size: 20px; font-weight: 900; }
        
        .admin-trending-box {
            background: rgba(255,69,58,0.08);
            border: 1px solid rgba(255,69,58,0.2);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-admin-item {
            background: var(--input-bg);
            border: 1px solid rgba(255,69,48,0.3);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 12px;
            font-size: 12px;
            transition: 0.2s;
        }
        .report-admin-item:hover { border-color: rgba(255,59,48,0.6); }

        .detail-header { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        .detail-icon { width: 75px; height: 75px; border-radius: 18px; object-fit: cover; border: 1px solid var(--border-color); }
        .star-rating { color: #ff9f0a; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 4px; margin: 4px 0; }
        .comment-box { background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 12px; }
        .comment-user { color: #0a84ff; font-weight: 700; margin-bottom: 3px; }
        
        .tool-guide-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .tool-guide-card h3 { color: #ff453a; margin-top: 0; font-size: 16px; }
        .tool-guide-card p { color: var(--subtext-color); font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <svg width="20" height="20" viewBox="0 0 170 170" fill="#0a84ff"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.1-1.9-14.24-6.08-3.05-2.61-6.91-7.2-11.58-13.78-6.1-8.57-11.05-18.15-14.85-28.74-3.8-10.59-5.7-20.73-5.7-30.43 0-11.58 3.02-21.2 9.07-28.85 6.04-7.65 13.68-11.54 22.9-11.66 4.9 0 10.15 1.3 15.76 3.9 5.6 2.61 9.3 3.91 11.1 3.91 1.52 0 5.37-1.38 11.55-4.14 6.18-2.76 11.45-4.04 15.82-3.85 10.36.76 18.57 5.04 24.63 12.83-9.35 5.72-13.93 13.43-13.73 23.15.22 7.6 3.14 13.88 8.77 18.83 5.62 4.95 12.44 7.55 20.45 7.82-1.85 5.66-4.14 11.31-6.88 16.97zM119.22 31.33c0-7.39 2.68-14.25 8.04-20.58 5.36-6.33 12.18-10.23 20.45-11.72.11.87.16 1.69.16 2.47 0 7.18-2.83 14.28-8.5 23.3-5.66 9.02-12.39 13.6-20.15 13.73-.01-.89-.01-1.78 0-3.2z"/></svg>
            i<span>Store</span>
        </div>
        <div class="header-icons">
            <div class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">
                <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </div>
            <div class="icon-btn" onclick="openAccountModal()" title="User Account">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search any app, game or tool..." oninput="filterAppsSearch()">
        </div>

        <div id="dynamicContent"></div>
    </div>

    <button class="admin-add-float" id="adminAddFloatBtn" onclick="openAddAppModal()">+ Add New App</button>

    <div class="floating-nav">
        <button class="nav-item active" onclick="switchTab('today', this)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Today
        </button>
        <button class="nav-item" onclick="switchTab('games', this)">
            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3" ry="3"></rect><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><circle cx="15" cy="11" r="1.2" fill="currentColor"></circle><circle cx="18" cy="13" r="1.2" fill="currentColor"></circle></svg>
            Games
        </button>
        <button class="nav-item" onclick="switchTab('apps', this)">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            Apps
        </button>
        <button class="nav-item" onclick="switchTab('tools', this)">
            <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Tools
        </button>
        <button class="nav-item" id="adminNavTab" style="display:none; color:#ff453a;" onclick="switchTab('admin_panel', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            Admin
        </button>
    </div>

    <!-- Account Modal -->
    <div id="accountModal" class="modal">
        <div class="modal-box" style="text-align: center;">
            <button class="modal-close-x" onclick="document.getElementById('accountModal').style.display='none'">✕</button>
            <div id="loggedOutView">
                <h3 style="margin-top:0; color:var(--text-color); font-size:16px;">User Account</h3>
                <p style="color:var(--subtext-color); font-size:12px; margin-bottom:15px;">Sign in to review apps and post comments.</p>
                <button onclick="loginWithGoogle()" style="background:#fff; color:#000; border:none; width:100%; padding:11px; border-radius:12px; font-weight:bold; cursor:pointer; font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.16 21.39 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.12 0 9.81 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.16 2.61 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                    Sign in with Google
                </button>
            </div>
            <div id="loggedInView" style="display:none;">
                <h3 id="userEmailText" style="color:#32d74b; font-size:12px; margin-bottom:8px; word-break: break-all;"></h3>
                <p id="adminBadge" style="color:#ff453a; font-size:12px; font-weight:bold; margin-bottom:15px; display:none;">👑 Store Administrator</p>
                <button onclick="auth.signOut()" style="background:#ff453a; color:#fff; border:none; width:100%; padding:10px; border-radius:10px; font-weight:bold; cursor:pointer;">Sign Out</button>
            </div>
            <button onclick="document.getElementById('accountModal').style.display='none'" style="background:var(--input-bg); color:var(--text-color); border:none; width:100%; padding:10px; border-radius:10px; margin-top:12px; cursor:pointer;">Close</button>
        </div>
    </div>

    <!-- Add/Edit App Modal -->
    <div id="addAppModal" class="modal">
        <div class="modal-box">
            <button class="modal-close-x" onclick="document.getElementById('addAppModal').style.display='none'">✕</button>
            <h3 id="modalTitleText" style="margin-top:0; color:var(--text-color); font-size:16px;">Add App to Cloud</h3>
            <input type="hidden" id="editingAppId">
            <div style="font-size:11px; color:var(--subtext-color); margin-bottom:4px;">Select Category:</div>
            <select id="appCategory" class="input-field">
                <option value="today">Today (Featured Main)</option>
                <option value="games">Games</option>
                <option value="apps">Apps</option>
                <option value="tools">Tools</option>
            </select>
            <div style="font-size:11px; color:var(--subtext-color); margin-bottom:4px;">App Icon:</div>
            <input type="file" id="appImgFile" class="input-field" accept="image/*">
            
            <div style="font-size:11px; color:var(--subtext-color); margin-bottom:4px;">Screenshots:</div>
            <input type="file" id="appScreenshotsFile" class="input-field" accept="image/*" multiple>

            <input type="text" id="appName" class="input-field" placeholder="App Name (e.g. GTA San Andreas)">
            <input type="text" id="appDesc" class="input-field" placeholder="Description or Size (e.g. Action • 2.1 GB)">
            <input type="text" id="appUrl" class="input-field" placeholder="Direct Download Link (.ipa)">
            <button onclick="saveNewApp()" style="background:#ff453a; color:#fff; border:none; width:100%; padding:11px; border-radius:12px; font-weight:bold; cursor:pointer; font-family:'Inter',sans-serif;">Save & Publish</button>
            <button onclick="document.getElementById('addAppModal').style.display='none'" style="background:var(--input-bg); color:var(--text-color); border:none; width:100%; padding:10px; border-radius:10px; margin-top:8px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <!-- App Details Bottom Sheet -->
    <div id="appDetailModal" class="bottom-sheet-modal">
        <div class="bottom-sheet-content" id="appDetailBody"></div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal" class="modal">
        <div class="modal-box">
            <button class="modal-close-x" onclick="document.getElementById('reportModal').style.display='none'">✕</button>

    <script>
        const firebaseConfig = {

        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // تم إضافة إيمايل صهيب هنا بجانب إيمايلك الخاص
        const ADMIN_EMAILS = ["benssariyassine@gmail.com", "suohaib1415@gmail.com"];
        let currentUser = null;
        let isAdmin = false;
        let currentTab = 'today';
        let allAppsCache = [];
        let allReportsCache = [];
        let isLightMode = false;

        function toggleDarkMode() {
            isLightMode = !isLightMode;
            document.body.classList.toggle('light-mode', isLightMode);
            const icon = document.getElementById('themeIcon');
            if(isLightMode) {
                icon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            } else {
                icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            }
        }

        function getActualDateString() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('en-US', options);
        }

        function switchTab(tabName, btnElement) {
            currentTab = tabName;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderUI();
        }

        db.collection("apps").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            allAppsCache = [];
            snapshot.forEach(doc => {
                allAppsCache.push({ id: doc.id, ...doc.data() });
            });
            renderUI();
        });

        db.collection("reports").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            allReportsCache = [];
            snapshot.forEach(doc => {
                allReportsCache.push({ id: doc.id, ...doc.data() });
            });
            if(currentTab === 'admin_panel') renderUI();
        });

        function filterAppsSearch() {
            renderUI();
        }

        function getTrendingScore(app) {
            const rating = app.ratingCount ? (app.ratingSum / app.ratingCount) : 0;
            const downloads = app.downloads || 0;
            const comments = app.commentsCount || 0;
            return (rating * 15) + (downloads * 5) + (comments * 10);
        }

        function renderUI() {
            const container = document.getElementById('dynamicContent');
            const searchInputEl = document.getElementById('searchInput');
            const searchQuery = searchInputEl ? searchInputEl.value.toLowerCase() : '';
            
            let filtered = allAppsCache;
            if (searchQuery.trim() !== "") {
                filtered = allAppsCache.filter(app => app.name.toLowerCase().includes(searchQuery) || app.desc.toLowerCase().includes(searchQuery));
                container.innerHTML = `<div class="section-heading">Search Results (${filtered.length})</div><div id="searchResContainer"></div>`;
                const sContainer = document.getElementById('searchResContainer');
                if(filtered.length === 0) {
                    sContainer.innerHTML = `<p style="color:var(--subtext-color); text-align:center; font-size:13px; margin-top:30px;">No matching apps found.</p>`;
                } else {
                    filtered.forEach(app => sContainer.innerHTML += createAppCardHTML(app));
                }
                return;
            }

            if (currentTab === 'admin_panel' && isAdmin) {
                let totalApps = allAppsCache.length;
                let totalReports = allReportsCache.length;
                let mostActiveApp = "None yet";
                if(totalApps > 0) {
                    let sortedByRating = [...allAppsCache].sort((a,b) => getTrendingScore(b) - getTrendingScore(a));
                    mostActiveApp = sortedByRating[0].name + " (#1 Trending)";
                }

                let reportsHTML = "";
                if(totalReports === 0) {
                    reportsHTML = `<div style="text-align:center; padding:25px 0;"><p style="color:#32d74b; font-weight:700; font-size:13px; margin:0;">✨ Awesome! No pending reports.</p></div>`;
                } else {
                    allReportsCache.forEach(rep => {
                        let targetApp = allAppsCache.find(a => a.id === rep.appId);
                        let appName = targetApp ? targetApp.name : "Unknown/Deleted App";
                        reportsHTML += `
                            <div class="report-admin-item">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                    <span style="color:#ff453a; font-weight:900; font-size:13px;">🚨 App: ${appName}</span>
                                    <span style="color:var(--subtext-color); font-size:10px;">By: ${rep.user}</span>
                                </div>
                                <div style="color:var(--text-color); font-size:13px; margin-bottom:10px; background:var(--modal-bg); padding:8px 10px; border-radius:8px;">💬 Reason: "${rep.reason}"</div>
                                <div style="display:flex; justify-content:flex-end;">
                                    <button onclick="deleteReport('${rep.id}')" style="background:#ff453a; color:#fff; border:none; padding:5px 12px; border-radius:8px; font-weight:bold; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;">Resolve & Delete</button>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">Admin Dashboard</div>
                        <div class="today-subtitle">👑 iStore Control Center</div>
                    </div>
                    
                    <div class="admin-dashboard-wrapper">
                        <div class="admin-section-card">
                            <h4 style="font-size:14px; margin:0 0 12px 0; color:var(--text-color); border-bottom:1px solid var(--border-color); padding-bottom:8px;">📊 Platform Performance</h4>
                            <div class="admin-stats-grid">
                                <div class="stat-box">
                                    <h5>Total Apps</h5>
                                    <p style="color:var(--text-color);">${totalApps}</p>
                                </div>
                                <div class="stat-box">
                                    <h5>Active Reports</h5>
                                    <p>${totalReports}</p>
                                </div>
                            </div>
                            <div class="admin-trending-box">
                                <span style="color:var(--subtext-color);">Top Trending App (#1):</span>
                                <strong style="color:var(--text-color);">${mostActiveApp}</strong>
                            </div>
                        </div>

                        <div class="admin-section-card">
                            <h4 style="font-size:14px; margin:0 0 12px 0; color:var(--text-color); border-bottom:1px solid var(--border-color); padding-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                                <span>🚨 User Reports</span>
                                <span style="background:rgba(255,69,58,0.15); color:#ff453a; font-size:10px; padding:2px 8px; border-radius:6px; font-weight:900;">${totalReports} Active</span>
                            </h4>
                            <div style="max-height:400px; overflow-y:auto;">
                                ${reportsHTML}
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            if (currentTab === 'today') {
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-date">${getActualDateString()}</div>
                        <div class="today-title">Today</div>
                        <div class="today-subtitle">🔥 Special Updates & Highlights</div>
                    </div>
                    <div id="todayAppsContainer"></div>
                    <div class="section-heading">Trending (#1) & General Apps</div>
                    <div id="generalAppsContainer"></div>
                `;
                
                let sortedByTrending = [...allAppsCache].sort((a,b) => getTrendingScore(b) - getTrendingScore(a));
                const todayList = sortedByTrending.filter(app => app.category === 'today' || !app.category);
                const generalList = sortedByTrending;

                const tContainer = document.getElementById('todayAppsContainer');
                if (todayList.length === 0) {
                    tContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center;">No featured apps in Today yet.</p>`;
                } else {
                    todayList.forEach((app, index) => {
                        let avgRating = app.ratingCount ? (app.ratingSum / app.ratingCount).toFixed(1) : 0;
                        let isTopOne = (index === 0) ? '<span style="background:#ff453a; color:#fff; font-size:10px; font-weight:900; padding:2px 8px; border-radius:6px; margin-left:6px;">#1 Trending</span>' : '';
                        tContainer.innerHTML += `
                            <div class="featured-card">
                                <img src="${app.icon || 'https://via.placeholder.com/300'}" class="featured-img" style="cursor:pointer;" onclick="openAppDetails('${app.id}')">
                                <div class="featured-body">
                                    <div style="display:flex; align-items:center; margin-bottom:6px;">
                                        <span class="badge-tag" style="margin-bottom:0;">Featured Today • ⭐ ${avgRating}</span>
                                        ${isTopOne}
                                    </div>
                                    <h3 style="margin:5px 0 2px 0; font-size:17px; cursor:pointer;" onclick="openAppDetails('${app.id}')">${app.name}</h3>
                                    <div class="app-category-sub" style="margin-bottom:6px;">${getCategoryNameEn(app.category)}</div>
                                    <p style="color:var(--subtext-color); font-size:12px; margin:0 0 14px 0;">${app.desc}</p>
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <a href="${app.url}" class="btn-install" target="_blank" onclick="incrementDownload('${app.id}')">Install Now</a>
                                        <div style="display:flex; gap:6px;">
                                            <button onclick="openReportModal('${app.id}')" style="background:var(--input-bg); color:#ff453a; border:none; padding:5px 9px; border-radius:8px; font-size:10px; cursor:pointer;">Report</button>
                                            ${isAdmin ? `<div class="admin-btns"><button class="btn-edit" onclick="openEditAppModal('${app.id}')">Edit</button><button class="btn-del" onclick="deleteApp('${app.id}')">Delete</button></div>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                const gContainer = document.getElementById('generalAppsContainer');
                if (generalList.length === 0) {
                    gContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center;">No other apps available.</p>`;
                } else {
                    generalList.forEach((app, idx) => {
                        let rankBadge = (idx === 0) ? '<span style="color:#ff453a; font-weight:900; margin-right:6px;">#1</span>' : '';
                        gContainer.innerHTML += createAppCardHTML(app, rankBadge);
                    });
                }

            } else if (currentTab === 'tools') {
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">Installation Tools</div>
                        <div class="today-subtitle">Official signing guides & tools</div>
                    </div>
                    <div style="margin-top:15px;">
                        <div class="tool-guide-card">
                            <h3>E-Sign App (Certificate Signing)</h3>
                            <p><strong>E-Sign</strong> is one of the best tools to sign and install IPA files directly on your iPhone without a computer, using Enterprise Certificates.</p>
                            <p><strong>How to use:</strong><br>1. Download a trusted enterprise certificate.<br>2. Install E-Sign from official sources.<br>3. Open E-Sign, go to settings and import the IPA file downloaded from our store.</p>
                        </div>
                        <div class="tool-guide-card">
                            <h3>Scarlet & TrollStore</h3>
                            <p>Powerful alternatives for app installation, providing great stability and avoiding frequent certificate revocations.</p>
                        </div>
                    </div>
                `;
            } else {
                let tabFiltered = allAppsCache.filter(app => app.category === currentTab);
                tabFiltered.sort((a,b) => getTrendingScore(b) - getTrendingScore(a));
                const titles = { games: 'iPhone Games', apps: 'Featured Apps' };
                
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">${titles[currentTab] || 'Applications'}</div>
                        <div class="today-subtitle">Continuously updated IPA library</div>
                    </div>
                    <div style="margin-top:15px;" id="filteredContainer"></div>
                `;
                
                const fContainer = document.getElementById('filteredContainer');
                if (tabFiltered.length === 0) {
                    fContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center; margin-top:40px;">No apps in this category yet.</p>`;
                } else {
                    tabFiltered.forEach((app, idx) => {
                        let rankBadge = (idx === 0) ? '<span style="color:#ff453a; font-weight:900; margin-right:6px;">#1</span>' : '';
                        fContainer.innerHTML += createAppCardHTML(app, rankBadge);
                    });
                }
            }
        }

        function getCategoryNameEn(cat) {
            if(cat === 'games') return 'Games';
            if(cat === 'apps') return 'Apps';
            if(cat === 'tools') return 'Tools';
            return 'Utilities';
        }

        function createAppCardHTML(app, rankBadge = '') {
            let avgRating = app.ratingCount ? (app.ratingSum / app.ratingCount).toFixed(1) : 0;
            return `
                <div class="app-card-pro">
                    <div class="app-meta" onclick="openAppDetails('${app.id}')">
                        <img src="${app.icon || 'https://via.placeholder.com/60'}" class="app-icon-img">
                        <div class="app-details">
                            <h4>${rankBadge}${app.name}</h4>
                            <div class="app-category-sub">${getCategoryNameEn(app.category)}</div>
                            <p>${app.desc} • ⭐ ${avgRating}</p>
                        </div>
                    </div>
                    <div class="app-actions">
                        <a href="${app.url}" class="btn-install" target="_blank" onclick="incrementDownload('${app.id}')">Get</a>
                        <button onclick="openReportModal('${app.id}')" style="background:var(--input-bg); color:#ff453a; border:none; padding:6px 8px; border-radius:10px; font-size:10px; cursor:pointer;" title="Report">⚠️</button>
                        ${isAdmin ? `<div class="admin-btns"><button class="btn-edit" onclick="openEditAppModal('${app.id}')">Edit</button><button class="btn-del" onclick="deleteApp('${app.id}')">Delete</button></div>` : ''}
                    </div>
                </div>
            `;
        }

        function incrementDownload(appId) {
            const appRef = db.collection("apps").doc(appId);
            appRef.update({
                downloads: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {});
        }

        function openAppDetails(appId) {
            const app = allAppsCache.find(a => a.id === appId);
            if (!app) return;
            
            let avgRating = app.ratingCount ? (app.ratingSum / app.ratingCount).toFixed(1) : 0;
            
            let screenshotsHTML = '';
            if (app.screenshots && app.screenshots.length > 0) {
                app.screenshots.forEach(imgUrl => {
                    screenshotsHTML += `<img src="${imgUrl}" class="screenshot-item">`;
                });
            } else {
                screenshotsHTML = `<p style="color:var(--subtext-color); font-size:11px;">No screenshots available.</p>`;
            }

            db.collection("apps").doc(appId).collection("comments").orderBy("createdAt", "desc").get().then(snapshot => {
                let commentsList = [];
                snapshot.forEach(doc => commentsList.push(doc.data()));
                
                let commentsHTML = '';
                if(commentsList.length === 0) {
                    commentsHTML = `<p style="color:var(--subtext-color); font-size:12px; text-align:center;">No comments yet. Be the first!</p>`;
                } else {
                    commentsList.forEach(c => {
                        commentsHTML += `
                            <div class="comment-box">
                                <div class="comment-user">${c.userName}</div>
                                <div>${c.text}</div>
                            </div>
                        `;
                    });
                }

                document.getElementById('appDetailBody').innerHTML = `
                    <div style="width:40px; height:4px; background:var(--border-color); border-radius:10px; margin:0 auto 16px auto;"></div>
                    <div class="detail-header">
                        <img src="${app.icon || 'https://via.placeholder.com/75'}" class="detail-icon">
                        <div>
                            <h3 style="margin:0 0 2px 0; font-size:17px; color:var(--text-color);">${app.name}</h3>
                            <div style="font-size:11px; color:var(--subtext-color); font-weight:600; margin-bottom:3px;">${getCategoryNameEn(app.category)}</div>
                            <p style="margin:0; font-size:12px; color:var(--subtext-color);">${app.desc}</p>
                            <div class="star-rating">⭐ ${avgRating} <span style="font-size:11px; color:var(--subtext-color);">(${app.ratingCount || 0} reviews)</span></div>
                        </div>
                    </div>

                    <a href="${app.url}" class="btn-install" style="display:block; text-align:center; padding:11px; margin-bottom:15px;" target="_blank" onclick="incrementDownload('${app.id}')">Direct Download (.ipa)</a>
                    
                    <div style="border-top:1px solid var(--border-color); padding-top:12px; margin-bottom:12px;">
                        <h4 style="font-size:13px; margin:0 0 6px 0; color:var(--text-color);">Screenshots:</h4>
                        <div class="screenshots-container">
                            ${screenshotsHTML}
                        </div>
                    </div>

                    <div style="border-top:1px solid var(--border-color); padding-top:12px; margin-bottom:12px;">
                        <h4 style="font-size:13px; margin:0 0 8px 0; color:var(--text-color);">Rate this app:</h4>
                        <div style="display:flex; gap:10px; justify-content:center;">
                            <button onclick="rateApp('${app.id}', 1)" style="background:var(--input-bg); border:1px solid #ff9f0a; color:var(--text-color); padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:bold;">⭐ 1</button>
                            <button onclick="rateApp('${app.id}', 3)" style="background:var(--input-bg); border:1px solid #ff9f0a; color:var(--text-color); padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:bold;">⭐⭐⭐ 3</button>
                            <button onclick="rateApp('${app.id}', 5)" style="background:var(--input-bg); border:1px solid #ff9f0a; color:var(--text-color); padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:bold;">⭐⭐⭐⭐⭐ 5</button>
                        </div>
                    </div>

                    <div style="border-top:1px solid var(--border-color); padding-top:12px;">
                        <h4 style="font-size:13px; margin:0 0 8px 0; color:var(--text-color);">Comments (${commentsList.length}):</h4>
                        <div style="max-height:160px; overflow-y:auto; margin-bottom:10px;" id="commentsListArea">
                            ${commentsHTML}
                        </div>
                        ${currentUser ? `
                            <input type="text" id="newCommentText" class="input-field" placeholder="Write a comment..." style="margin-bottom:6px;">
                            <button onclick="postComment('${app.id}')" style="background:#0a84ff; color:#fff; border:none; width:100%; padding:9px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px;">Post Comment</button>
                        ` : `<p style="color:#ff453a; font-size:11px; text-align:center;">Sign in via the account menu to post comments.</p>`}
                    </div>
                    
                    <button onclick="document.getElementById('appDetailModal').style.display='none'" style="background:var(--input-bg); color:var(--text-color); border:none; width:100%; padding:10px; border-radius:12px; margin-top:16px; cursor:pointer; font-weight:bold;">Close</button>
                `;
                document.getElementById('appDetailModal').style.display = 'flex';
            });
        }

        function rateApp(appId, stars) {
            if (!currentUser) { alert('Please sign in first to rate'); return; }
            const appRef = db.collection("apps").doc(appId);
            db.runTransaction(transaction => {
                return transaction.get(appRef).then(doc => {
                    if (!doc.exists) return;
                    let data = doc.data();
                    let newSum = (data.ratingSum || 0) + stars;
                    let newCount = (data.ratingCount || 0) + 1;
                    transaction.update(appRef, { ratingSum: newSum, ratingCount: newCount });
                });
            }).then(() => {
                alert('Thank you, rating submitted successfully!');
                openAppDetails(appId);
            }).catch(err => alert("Error: " + err.message));
        }

        function postComment(appId) {
            if (!currentUser) { alert('Sign in first'); return; }
            const text = document.getElementById('newCommentText').value.trim();
            if (!text) return;

            db.collection("apps").doc(appId).collection("comments").add({
                userName: currentUser.email.split('@')[0],
                text: text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                db.collection("apps").doc(appId).update({
                    commentsCount: firebase.firestore.FieldValue.increment(1)
                }).catch(()=>{});

                document.getElementById('newCommentText').value = '';
                openAppDetails(appId);
            });
        }

        function openReportModal(appId) {
            document.getElementById('reportAppId').value = appId;
            document.getElementById('reportReason').value = '';
            document.getElementById('reportModal').style.display = 'flex';
        }

        function setReportReasonText(reasonText) {
            document.getElementById('reportReason').value = reasonText;
        }

        function submitReport() {
            const appId = document.getElementById('reportAppId').value;
            const reason = document.getElementById('reportReason').value.trim();
            if (!reason) { alert('Please select or type a report reason'); return; }

            db.collection("reports").add({
                appId, reason,
                user: currentUser ? currentUser.email : 'Guest',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert('Report sent to admin successfully. Thank you!');
                document.getElementById('reportModal').style.display = 'none';
            });
        }

        function deleteReport(reportId) {
            if (!isAdmin) return;
            if (confirm('Delete this report permanently?')) {
                db.collection("reports").doc(reportId).delete();
            }
        }

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const floatBtn = document.getElementById('adminAddFloatBtn');
            const adminBadge = document.getElementById('adminBadge');
            const adminNavTab = document.getElementById('adminNavTab');
            
            if (user) {
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'block';
                document.getElementById('userEmailText').innerText = user.email;
                
                // التحقق مما إذا كان إيمايل المستخدم الحالي موجوداً ضمن مصفوفة الأدمنية ADMIN_EMAILS
                if (user.email && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase())) {
                    isAdmin = true;
                    floatBtn.style.display = 'block';
                    adminBadge.style.display = 'block';
                    adminNavTab.style.display = 'flex';
                } else {
                    isAdmin = false;
                    floatBtn.style.display = 'none';
                    adminBadge.style.display = 'none';
                    adminNavTab.style.display = 'none';
                }
            } else {
                isAdmin = false;
                floatBtn.style.display = 'none';
                adminBadge.style.display = 'none';
                adminNavTab.style.display = 'none';
                document.getElementById('loggedOutView').style.display = 'block';
                document.getElementById('loggedInView').style.display = 'none';
            }
            renderUI();
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(() => auth.signInWithRedirect(provider));
        }

        function openAccountModal() { document.getElementById('accountModal').style.display = 'flex'; }
        
        function openAddAppModal() {
            if (!isAdmin) return;
            document.getElementById('modalTitleText').innerText = "Add App to Cloud";
            document.getElementById('editingAppId').value = "";
            document.getElementById('appName').value = "";
            document.getElementById('appDesc').value = "";
            document.getElementById('appUrl').value = "";
            document.getElementById('appImgFile').value = "";
            document.getElementById('appScreenshotsFile').value = "";
            document.getElementById('addAppModal').style.display = 'flex';
        }

        function openEditAppModal(id) {
            if (!isAdmin) return;
            const app = allAppsCache.find(a => a.id === id);
            if (!app) return;
            document.getElementById('modalTitleText').innerText = "Edit App & URL";
            document.getElementById('editingAppId').value = app.id;
            document.getElementById('appCategory').value = app.category || 'today';
            document.getElementById('appName').value = app.name || '';
            document.getElementById('appDesc').value = app.desc || '';
            document.getElementById('appUrl').value = app.url || '';
            document.getElementById('addAppModal').style.display = 'flex';
        }

        function saveNewApp() {
            if (!isAdmin) return;
            const editingId = document.getElementById('editingAppId').value;
            const category = document.getElementById('appCategory').value;
            const name = document.getElementById('appName').value;
            const desc = document.getElementById('appDesc').value;
            const url = document.getElementById('appUrl').value || '#';
            const fileInput = document.getElementById('appImgFile');
            const screenshotsInput = document.getElementById('appScreenshotsFile');

            if (!name) { alert('Please enter app name'); return; }

            let iconResult = 'https://via.placeholder.com/60';
            if (editingId) {
                const found = allAppsCache.find(a => a.id === editingId);
                if (found) iconResult = found.icon;
            }

            let existingScreenshots = [];
            if (editingId) {
                const found = allAppsCache.find(a => a.id === editingId);
                if (found && found.screenshots) existingScreenshots = found.screenshots;
            }

            const processFilesAndSave = () => {
                let screenshotsList = [...existingScreenshots];
                
                if (screenshotsInput.files && screenshotsInput.files.length > 0) {
                    let filesLoaded = 0;
                    Array.from(screenshotsInput.files).forEach((file) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            screenshotsList.push(e.target.result);
                            filesLoaded++;
                            if (filesLoaded === screenshotsInput.files.length) {
                                commitAppToCloud(editingId, category, name, desc, url, iconResult, screenshotsList);
                            }
                        };
                        reader.readAsDataURL(file);
                    });
                } else {
                    commitAppToCloud(editingId, category, name, desc, url, iconResult, screenshotsList);
                }
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    iconResult = e.target.result;
                    processFilesAndSave();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processFilesAndSave();
            }
        }

        function commitAppToCloud(editingId, category, name, desc, url, icon, screenshots) {
            if (editingId) {
                db.collection("apps").doc(editingId).update({
                    category, name, desc, url, icon, screenshots
                }).then(() => {
                    document.getElementById('addAppModal').style.display = 'none';
                    alert('App updated successfully!');
                }).catch(err => alert("Error: " + err.message));
            } else {
                db.collection("apps").add({
                    category, name, desc, url, icon, screenshots,
                    ratingSum: 0,
                    ratingCount: 0,
                    downloads: 0,
                    commentsCount: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    document.getElementById('appName').value = '';
                    document.getElementById('appDesc').value = '';
                    document.getElementById('appUrl').value = '';
                    document.getElementById('appImgFile').value = '';
                    document.getElementById('appScreenshotsFile').value = '';
                    document.getElementById('addAppModal').style.display = 'none';
                }).catch(err => alert("Error: " + err.message));
            }
        }

        function deleteApp(id) {
            if (!isAdmin) return;
            if (confirm('Are you sure you want to delete this app permanently?')) {
                db.collection("apps").doc(id).delete();
            }
        }
    </script>
</body>
</html>
