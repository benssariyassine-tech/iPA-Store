<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iStore IPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- تنسيقات مباشرة لضمان ظهور الشكل الصحيح فوراً -->
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #000000;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1c1c1e;
        }
        .header-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
        }
        .burger-menu-btn {
            cursor: pointer;
            padding: 8px;
            background: #1c1c1e;
            border-radius: 10px;
        }
        .burger-line {
            width: 20px;
            height: 2px;
            background-color: #ffffff;
            margin: 4px 0;
            border-radius: 2px;
        }
        .main-content {
            padding: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        /* القائمة الجانبية */
        .side-menu {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background-color: #1c1c1e;
            z-index: 1000;
            transition: 0.3s ease;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }
        .side-menu.active {
            right: 0;
        }
        .side-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            z-index: 999;
        }
        .side-menu-overlay.active {
            display: block;
        }
        .side-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #2c2c2e;
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }
        .menu-item {
            padding: 12px;
            background: #2c2c2e;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        /* النافذة المنبثقة */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            box-sizing: border-box;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            background-color: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            color: #ffffff;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #0a84ff;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }
    </style>

    <!-- مكتبات Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-header">
        <div class="burger-menu-btn" onclick="toggleSideMenu()">
            <div class="burger-line"></div>
            <div class="burger-line"></div>
            <div class="burger-line"></div>
        </div>
        <h1 class="header-title">اليوم</h1>
        <div class="search-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div id="sideMenuOverlay" class="side-menu-overlay" onclick="toggleSideMenu()"></div>
    <div id="sideMenu" class="side-menu">
        <div class="side-menu-header">
            <h2 style="font-size: 18px; margin:0;">القائمة الرئيسية</h2>
            <button class="close-btn" onclick="toggleSideMenu()">✕</button>
        </div>
        <div class="menu-list">
            <div class="menu-item" onclick="openAuthModal(); toggleSideMenu();">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>تسجيل الدخول / حساب جديد</span>
            </div>
        </div>
    </div>

    <!-- حاوية عرض التطبيقات -->
    <div class="main-content">
        <h2 class="section-title">أبرز التحديثات</h2>
        <div id="appsContainer" class="apps-list">
            <p style="text-align:center; color:#8e8e93; padding: 20px;">جاري تحميل التطبيقات...</p>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول المنبثقة -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="authTitle" style="margin-top:0; font-size: 20px;">تسجيل الدخول</h2>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <input type="email" id="authEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="authPassword" placeholder="كلمة المرور" required>
                <button type="submit" id="authSubmitBtn" class="btn-primary">تسجيل الدخول</button>
            </form>
            <div style="margin-top: 15px; text-align: center; font-size: 13px;">
                <span id="authToggleText" style="color:#8e8e93;">ليس لديك حساب؟</span>
                <a href="#" id="authToggleBtn" onclick="toggleAuthMode(event)" style="color: #0a84ff; text-decoration: none; font-weight: bold; margin-right: 5px;">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <!-- استدعاء ملف البرمجة -->
    <script src="/static/script.js"></script>
</body>
</html>
