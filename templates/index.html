<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iStore IPA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#0b0b0f;--text-color:#fff;--card-bg:#16161c;--border-color:rgba(255,255,255,0.08);--subtext-color:#8e8e93;--header-bg:rgba(11,11,15,0.9);--nav-bg:rgba(18,18,24,0.75);--modal-bg:#16161c;--input-bg:#0b0b0f;--accent:#0a84ff;--danger:#ff453a;--success:#32d74b;--warning:#ff9f0a}
body.light-mode{--bg-color:#f2f2f7;--text-color:#000;--card-bg:#fff;--border-color:rgba(0,0,0,0.08);--subtext-color:#636366;--header-bg:rgba(242,242,247,0.9);--nav-bg:rgba(255,255,255,0.85);--modal-bg:#fff;--input-bg:#f2f2f7}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;transition:transform 0.2s cubic-bezier(0.2,0.8,0.2,1),opacity 0.2s ease,background-color 0.25s ease}
body{background:var(--bg-color);color:var(--text-color);font-family:'Inter',sans-serif;margin:0;padding:0 0 110px 0;direction:ltr;transition:background 0.3s,color 0.3s}
svg{display:inline-block;vertical-align:middle}

.header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--header-bg);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border-color)}
.logo-area{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:0.5px}
.logo-area span{color:var(--accent)}
.header-icons{display:flex;gap:10px;align-items:center}
.icon-btn{background:var(--card-bg);border:1px solid var(--border-color);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-color);cursor:pointer}
.icon-btn:active{transform:scale(0.9)}

.container{padding:16px 20px;max-width:600px;margin:auto;animation:fadeInUp 0.4s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.search-box{position:relative;margin-bottom:12px}
.search-input{width:100%;background:var(--input-bg);border:1px solid var(--border-color);padding:12px 45px 12px 45px;border-radius:16px;color:var(--text-color);font-family:'Inter',sans-serif;font-size:14px;box-sizing:border-box;outline:none}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(10,132,255,0.25)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--subtext-color);width:18px;height:18px;pointer-events:none}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--border-color);color:var(--text-color);border:none;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer}
.search-clear.show{display:flex}

.filter-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:5px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{background:var(--card-bg);border:1px solid var(--border-color);color:var(--subtext-color);padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;font-family:'Inter',sans-serif}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

.today-header{margin-bottom:15px;animation:fadeInUp 0.4s ease}
.today-date{color:var(--subtext-color);font-size:12px;font-weight:600}
.today-title{font-size:28px;font-weight:900;margin:2px 0}
.today-subtitle{font-size:13px;color:var(--danger);font-weight:700;display:flex;align-items:center;gap:5px}

.featured-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:22px;overflow:hidden;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,0.15);position:relative;animation:fadeInUp 0.4s ease}
.featured-img-wrapper{position:relative;width:100%;height:190px;overflow:hidden;background:var(--input-bg)}
.featured-img{width:100%;height:100%;object-fit:cover}
.platform-badge-float{position:absolute;top:8px;right:-28px;background:var(--danger);color:#fff;padding:2px 28px;font-size:8px;font-weight:900;transform:rotate(45deg);box-shadow:0 2px 6px rgba(0,0,0,0.3);letter-spacing:0.5px;z-index:10;pointer-events:none}
.featured-body{padding:16px}
.badge-tag{background:rgba(255,69,58,0.15);color:var(--danger);font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.section-heading{font-size:17px;font-weight:800;margin:20px 0 12px 0;display:flex;justify-content:space-between;align-items:center}

.app-card-pro{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;animation:fadeInUp 0.3s ease;position:relative;overflow:visible}
.app-card-pro:hover{border-color:rgba(10,132,255,0.3)}
.app-meta{display:flex;align-items:center;gap:10px;overflow:hidden;flex:1;cursor:pointer}
.app-icon-container{position:relative;width:54px;height:54px;flex-shrink:0}
.app-icon-img{width:54px;height:54px;border-radius:14px;object-fit:cover;border:1px solid var(--border-color);background:var(--input-bg)}
.app-details{overflow:hidden;flex:1;max-width:160px}
.app-details h4{margin:0 0 2px 0;font-size:13px;font-weight:700;color:var(--text-color);white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px;line-height:1.2}
.app-title-marquee{display:inline-block;white-space:nowrap;animation:marqueeScroll 8s ease-in-out infinite alternate}
@keyframes marqueeScroll{0%,20%{transform:translateX(0)}80%,100%{transform:translateX(-35%)}}
.app-details p{margin:0;font-size:10px;color:var(--subtext-color);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.app-publisher-tag{font-size:10px;color:var(--accent);font-weight:700;display:block;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-size-tag-red{background:rgba(255,69,58,0.15);color:var(--danger);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;display:inline-block}
.download-badge-green{background:rgba(50,215,75,0.15);color:var(--success);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;display:inline-flex;align-items:center;gap:3px}
.app-category-sub{font-size:10px;color:var(--subtext-color);font-weight:600;margin-top:1px}
.app-actions{display:flex;gap:5px;align-items:center;position:relative;flex-shrink:0}

.btn-install{background:linear-gradient(135deg,var(--accent),#0062d2);color:#fff;padding:6px 14px;border-radius:16px;font-size:12px;font-weight:800;border:none;box-shadow:0 3px 10px rgba(10,132,255,0.3);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-family:'Inter',sans-serif}
.btn-install:active{transform:scale(0.94)}

.btn-star-like{background:rgba(255,159,10,0.1);border:1px solid rgba(255,159,10,0.3);color:var(--warning);padding:4px 7px;border-radius:10px;display:flex;align-items:center;gap:3px;cursor:pointer;font-size:10px;font-weight:800;font-family:'Inter',sans-serif}
.btn-star-like:active{transform:scale(0.9)}
.btn-star-like.liked{background:rgba(255,159,10,0.25)}

.btn-share{background:rgba(10,132,255,0.1);border:1px solid rgba(10,132,255,0.3);color:var(--accent);padding:4px 7px;border-radius:10px;display:flex;align-items:center;gap:3px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-share:active{transform:scale(0.9)}

.btn-extra-dropdown{background:var(--input-bg);border:1px solid var(--border-color);color:var(--text-color);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.extra-files-menu{display:none;position:absolute;right:0;top:36px;background:var(--modal-bg);border:1px solid var(--border-color);border-radius:12px;padding:8px;width:170px;box-shadow:0 8px 20px rgba(0,0,0,0.3);z-index:50}
.extra-file-item{display:block;padding:6px 8px;font-size:11px;color:var(--text-color);text-decoration:none;border-radius:6px;background:var(--input-bg);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extra-file-item:hover{background:rgba(10,132,255,0.15);color:var(--accent)}

.admin-btns{display:flex;gap:4px}
.btn-edit{background:var(--accent);color:#fff;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:700;border:none;cursor:pointer;font-family:'Inter',sans-serif}
.btn-del{background:var(--danger);color:#fff;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:700;border:none;cursor:pointer;font-family:'Inter',sans-serif}

.btn-info-blue{background:rgba(10,132,255,0.15);border:1px solid rgba(10,132,255,0.3);color:var(--accent);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.btn-info-blue:active{transform:scale(0.9)}

.btn-report-text{background:transparent;border:none;color:var(--danger);font-size:10px;font-weight:700;cursor:pointer;padding:2px 4px;font-family:'Inter',sans-serif}

.dl-progress-box{width:100%;margin-top:6px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:8px;padding:5px 8px;box-sizing:border-box}
.dl-progress-text{font-size:10px;font-weight:800;color:var(--danger);margin-bottom:3px;display:flex;justify-content:space-between}
.dl-progress-bar-bg{width:100%;height:5px;background:rgba(255,69,58,0.15);border-radius:4px;overflow:hidden}
.dl-progress-bar-fill{height:100%;width:0%;background:var(--danger);transition:width 0.1s linear}

.skeleton-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.skeleton-box{background:linear-gradient(90deg,var(--border-color) 25%,rgba(255,255,255,0.05) 50%,var(--border-color) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.floating-nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:92%;max-width:480px;background:var(--nav-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid var(--border-color);border-radius:24px;display:flex;justify-content:space-around;padding:10px 6px;z-index:1000;box-shadow:0 15px 35px rgba(0,0,0,0.3)}
.nav-item{background:none;border:none;color:var(--subtext-color);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:'Inter',sans-serif;transition:0.25s}
.nav-item.active{color:var(--accent);transform:scale(1.08)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}

.modal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.75);align-items:center;justify-content:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal-box{background:var(--modal-bg);border:1px solid var(--border-color);border-radius:22px;padding:22px;width:88%;max-width:360px;max-height:85vh;overflow-y:auto;box-sizing:border-box;position:relative;animation:popIn 0.3s cubic-bezier(0.16,1,0.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
.modal-close-x{position:absolute;top:16px;right:16px;background:var(--input-bg);border:none;color:var(--text-color);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Inter',sans-serif}

.bottom-sheet-modal{display:none;position:fixed;z-index:2500;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bottom-sheet-content{background:var(--modal-bg);border:1px solid var(--border-color);border-top-left-radius:28px;border-top-right-radius:28px;padding:24px 20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-sizing:border-box;animation:slideUpSheet 0.35s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}

.screenshots-container{display:flex;gap:10px;overflow-x:auto;padding:10px 0;margin:12px 0;scroll-snap-type:x mandatory;scrollbar-width:none}
.screenshots-container::-webkit-scrollbar{display:none}
.screenshot-item{width:130px;height:230px;border-radius:14px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-color);scroll-snap-align:start;cursor:pointer;background:var(--input-bg)}

.input-field{width:100%;padding:11px;margin-bottom:10px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:12px;color:var(--text-color);box-sizing:border-box;font-family:'Inter',sans-serif;font-size:13px;outline:none}
.input-field:focus{border-color:var(--accent)}

.admin-add-float{position:fixed;bottom:84px;right:20px;background:var(--danger);color:#fff;padding:9px 16px;border-radius:25px;font-weight:800;font-size:12px;border:none;box-shadow:0 4px 15px rgba(255,69,58,0.4);cursor:pointer;z-index:999;display:none;align-items:center;gap:6px;font-family:'Inter',sans-serif}

.admin-dashboard-wrapper{display:flex;flex-direction:column;gap:16px;animation:fadeInUp 0.4s ease}
.admin-section-card{background:var(--card-bg);border:1px solid rgba(255,69,58,0.25);border-radius:20px;padding:18px}
.admin-stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:15px}
.stat-box{background:var(--input-bg);border:1px solid var(--border-color);padding:14px;border-radius:14px;text-align:center}
.stat-box h5{margin:0 0 6px 0;color:var(--subtext-color);font-size:11px;font-weight:700}
.stat-box p{margin:0;color:var(--danger);font-size:20px;font-weight:900}
.report-admin-item{background:var(--input-bg);border:1px solid rgba(255,69,58,0.3);padding:12px;border-radius:12px;margin-bottom:10px;font-size:12px}

.detail-header{display:flex;align-items:center;gap:15px;margin-bottom:12px}
.detail-icon{width:70px;height:70px;border-radius:16px;object-fit:cover;border:1px solid var(--border-color);background:var(--input-bg)}
.comment-box{background:var(--input-bg);border:1px solid var(--border-color);padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:12px}
.comment-user{color:var(--accent);font-weight:700;margin-bottom:2px}

.star-rating{display:flex;gap:6px;margin:8px 0;align-items:center}
.star-btn{background:none;border:none;cursor:pointer;padding:2px;line-height:1;color:var(--border-color);display:flex;align-items:center;justify-content:center}
.star-btn svg{width:26px;height:26px;fill:currentColor}
.star-btn.active{color:var(--warning)}
.star-btn:hover{transform:scale(1.15)}

#toastContainer{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90%}
.toast{background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;padding:12px 18px;font-size:13px;font-weight:700;color:var(--text-color);box-shadow:0 10px 30px rgba(0,0,0,0.3);display:flex;align-items:center;gap:10px;animation:toastIn 0.4s cubic-bezier(0.16,1,0.3,1);pointer-events:auto;min-width:220px}
.toast.success{border-color:rgba(50,215,75,0.4)}.toast.success .toast-icon{color:var(--success)}
.toast.error{border-color:rgba(255,69,58,0.4)}.toast.error .toast-icon{color:var(--danger)}
.toast.info .toast-icon{color:var(--accent)}
.toast.warning .toast-icon{color:var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px) scale(0.9)}}

.fav-empty{text-align:center;padding:60px 20px;color:var(--subtext-color)}
.fav-empty svg{width:60px;height:60px;stroke:var(--border-color);fill:none;stroke-width:1.5;margin-bottom:15px}

.similar-apps-container{display:flex;gap:10px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.similar-apps-container::-webkit-scrollbar{display:none}
.similar-app-card{background:var(--input-bg);border:1px solid var(--border-color);border-radius:12px;padding:10px;min-width:110px;max-width:110px;text-align:center;cursor:pointer;flex-shrink:0}
.similar-app-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.similar-app-card img{width:50px;height:50px;border-radius:12px;margin-bottom:6px;background:var(--card-bg)}
.similar-app-card h5{font-size:11px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-color);font-weight:700}
.similar-app-card p{font-size:9px;margin:3px 0 0 0;color:var(--subtext-color)}

.preview-bar{position:fixed;top:0;left:0;width:100%;background:var(--warning);color:#000;text-align:center;font-size:11px;font-weight:800;padding:5px 0;z-index:9999;display:flex;justify-content:center;align-items:center;gap:10px}

#imgViewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:10001;align-items:center;justify-content:center;padding:20px}
#imgViewer img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
#imgViewer .close-viewer{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-inline-sm{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6;flex-shrink:0}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="toastContainer"></div>

<div id="imgViewer">
<button class="close-viewer" onclick="closeImgViewer()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
<img id="imgViewerImg" src="">
</div>

<div id="previewBar" class="preview-bar" style="display:none;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<span>User Preview Mode</span>
<button onclick="toggleUserPreview()" style="background:#000;color:#fff;border:none;padding:2px 8px;border-radius:6px;font-size:10px;cursor:pointer;font-weight:bold;font-family:'Inter',sans-serif;">Exit</button>
</div>

<div class="header">
<div class="logo-area">
<svg width="20" height="20" viewBox="0 0 170 170" fill="#0a84ff"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.1-1.9-14.24-6.08-3.05-2.61-6.91-7.2-11.58-13.78-6.1-8.57-11.05-18.15-14.85-28.74-3.8-10.59-5.7-20.73-5.7-30.43 0-11.58 3.02-21.2 9.07-28.85 6.04-7.65 13.68-11.54 22.9-11.66 4.9 0 10.15 1.3 15.76 3.9 5.6 2.61 9.3 3.91 11.1 3.91 1.52 0 5.37-1.38 11.55-4.14 6.18-2.76 11.45-4.04 15.82-3.85 10.36.76 18.57 5.04 24.63 12.83-9.35 5.72-13.93 13.43-13.73 23.15.22 7.6 3.14 13.88 8.77 18.83 5.62 4.95 12.44 7.55 20.45 7.82-1.85 5.66-4.14 11.31-6.88 16.97zM119.22 31.33c0-7.39 2.68-14.25 8.04-20.58 5.36-6.33 12.18-10.23 20.45-11.72.11.87.16 1.69.16 2.47 0 7.18-2.83 14.28-8.5 23.3-5.66 9.02-12.39 13.6-20.15 13.73-.01-.89-.01-1.78 0-3.2z"/></svg>
i<span>Store</span>
</div>

function showToast(msg, type='info', duration=3000){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const map = {success:ICONS.check, error:ICONS.close, warning:ICONS.warning, info:ICONS.info};
  t.innerHTML = (map[type]||ICONS.info) + '<span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(()=>{ t.style.animation='toastOut 0.4s forwards'; setTimeout(()=>t.remove(),400); }, duration);
}

function savePrefs(){ try{ localStorage.setItem('istore_prefs', JSON.stringify({lightMode:isLightMode, tab:currentTab, favorites:userFavorites})); }catch(e){} }
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('istore_prefs')||'{}');
    if(p.lightMode){ isLightMode = true; document.body.classList.add('light-mode'); }
    if(p.favorites) userFavorites = p.favorites;
    if(p.tab && p.tab !== 'admin_panel') currentTab = p.tab;
  }catch(e){}
}

function toggleUserPreview(){

  document.getElementById('adminAddFloatBtn').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('adminNavTab').style.display = isAdmin ? 'flex' : 'none';
  renderUI();
}

  if(btnElement) btnElement.classList.add('active');
  else { const t = document.querySelector('.nav-item[data-tab="'+tabName+'"]'); if(t) t.classList.add('active'); }
  window.scrollTo({top:0,behavior:'smooth'});
  savePrefs();
  renderUI();
}

db.collection("apps").orderBy("createdAt","desc").onSnapshot(snapshot=>{
  allAppsCache = [];
  snapshot.forEach(doc=>{
    let data = doc.data();
    if(data.name && data.name.toLowerCase().includes("gta") && data.category !== "games") data.category = "games";
    allAppsCache.push({id:doc.id, ...data});
  });
  renderUI();
}, err=>{ console.warn('Apps err:',err); showToast('Error loading apps','error'); });

db.collection("reports").orderBy("createdAt","desc").onSnapshot(snapshot=>{
  allReportsCache = [];
  snapshot.forEach(doc=>allReportsCache.push({id:doc.id, ...doc.data()}));
  if(currentTab === 'admin_panel') renderUI();
}, err=>{ console.warn('Reports err:',err); });

function onSearchInput(){
  const val = document.getElementById('searchInput').value;
  document.getElementById('searchClear').classList.toggle('show', val.length>0);
  renderUI();
}
function clearSearch(){
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  renderUI();
}

function getTrendingScore(app){
  const likes = (app.likedBy && Array.isArray(app.likedBy)) ? app.likedBy.length : 0;
  const downloads = app.downloads || 0;
  const comments = app.commentsCount || 0;
  return (likes*15) + (downloads*5) + (comments*10);
}
function getAverageRating(app){ if(!app.ratingCount || app.ratingCount===0) return 0; return (app.ratingSum||0)/app.ratingCount; }

function renderSkeleton(){
  let h = '';
  for(let i=0;i<3;i++) h += '<div class="skeleton-card"><div class="skeleton-box" style="width:54px;height:54px;border-radius:14px;flex-shrink:0;"></div><div style="flex:1;"><div class="skeleton-box" style="height:12px;width:70%;margin-bottom:8px;"></div><div class="skeleton-box" style="height:10px;width:50%;margin-bottom:6px;"></div><div class="skeleton-box" style="height:10px;width:40%;"></div></div></div>';
  return h;
}

function setFilter(f){ currentFilter = f; renderUI(); }

function getCategoryNameEn(cat){
  if(cat==='games') return 'Games';
  if(cat==='apps') return 'Apps';
  if(cat==='tools') return 'Tools';
  return 'Utilities';
}

nter;"><button class="btn-report-text" onclick="openReportModal(\''+app.id+'\')">Report</button>'+(isAdmin?'<div class="admin-btns"><button class="btn-edit" onclick="openEditAppModal(\''+app.id+'\')">Edit</button><button class="btn-del" onclick="deleteApp(\''+app.id+'\')">Delete</button></div>':'')+'</div></div><div id="dl_progress_'+app.id+'" class="dl-progress-box" style="display:none;"><div class="dl-progress-text" id="dl_text_'+app.id+'">Loading 0%</div><div class="dl-progress-bar-bg"><div class="dl-progress-bar-fill" id="dl_fill_'+app.id+'"></div></div></div></div></div>';

function toggleExtraMenu(appId, event){
  event.stopPropagation();
  const menu = document.getElementById('extraMenu_'+appId);
  const isOpen = menu.style.display === 'block';
  document.querySelectorAll('.extra-files-menu').forEach(m=>m.style.display='none');
  if(!isOpen) menu.style.display = 'block';
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.extra-files-menu').forEach(m=>m.style.display='none'); });

function startRealDownload(appId, fileUrl, appName){
  incrementDownload(appId);
  const pb = document.getElementById('dl_progress_'+appId);
  const pt = document.getElementById('dl_text_'+appId);
  const pf = document.getElementById('dl_fill_'+appId);
  if(pb) pb.style.display = 'block';
  if(!fileUrl || fileUrl === '#' || fileUrl.trim() === ''){
    if(pt) pt.innerText = "Download link not available";
    setTimeout(()=>{ if(pb) pb.style.display='none'; }, 2500);
    return;
  }
  if(pt) pt.innerText = "Loading 50%... Starting Download";
  if(pf) pf.style.width = "50%";
  setTimeout(()=>{
    if(pt) pt.innerText = "Loading 100% - Redirecting...";
    if(pf) pf.style.width = "100%";
    const a = document.createElement('a');
    a.href = fileUrl; a.target = '_blank'; a.download = appName;
    document.body.appendChild(a); a.click(); a.remove();
    showToast('Download started: '+appName, 'success');
    setTimeout(()=>{ if(pb) pb.style.display='none'; }, 2000);
  }, 700);
}

function incrementDownload(appId){
  const userId = currentUser ? currentUser.email : 'guest_'+Math.random().toString(36).substring(7);
  const appRef = db.collection("apps").doc(appId);
  db.runTransaction(transaction=>{
    return transaction.get(appRef).then(doc=>{
      if(!doc.exists) return;
      let data = doc.data();
      let downloadedBy = data.downloadedBy || [];
      if(!downloadedBy.includes(userId)){
        downloadedBy.push(userId);
        transaction.update(appRef, {downloads: firebase.firestore.FieldValue.increment(1), downloadedBy: downloadedBy});
      }
    });
  }).catch(()=>{});
}

function toggleStarLike(appId, event){
  if(event) event.stopPropagation();
  if(!currentUser){ showToast('Please sign in to like', 'warning'); openAccountModal(); return; }
  const appRef = db.collection("apps").doc(appId);
  const userEmail = currentUser.email;
  db.runTransaction(transaction=>{
    return transaction.get(appRef).then(doc=>{
      if(!doc.exists) return;
      let data = doc.data();
      let likedBy = data.likedBy || [];
      if(likedBy.includes(userEmail)){ likedBy = likedBy.filter(e=>e!==userEmail); showToast('Like removed', 'info', 1500); }
      else { likedBy.push(userEmail); showToast('App liked!', 'success', 1500); }
      transaction.update(appRef, {likedBy: likedBy});
    });
  }).catch(err=>showToast('Error: '+err.message, 'error'));
}

function toggleFavorite(appId, event){
  if(event) event.stopPropagation();
  const idx = userFavorites.indexOf(appId);
  if(idx>-1){ userFavorites.splice(idx,1); showToast('Removed from favorites', 'info', 1500); }
  else { userFavorites.push(appId); showToast('Added to favorites', 'success', 1500); }
  savePrefs();
  updateFavBtnVisibility();
  renderUI();
}

function updateFavBtnVisibility(){
  const b = document.getElementById('favHeaderBtn');
  if(b) b.style.display = userFavorites.length>0 ? 'flex' : 'none';
}

function shareApp(appId, event){
  if(event) event.stopPropagation();
  const app = allAppsCache.find(a=>a.id===appId);
  if(!app) return;
  const shareData = {title: app.name, text: 'Check out '+app.name+' on iStore!', url: window.location.href.split('#')[0]+'#app-'+appId};
  if(navigator.share) navigator.share(shareData).catch(()=>{});
  else navigator.clipboard.writeText(shareData.url).then(()=>showToast('Link copied', 'success')).catch(()=>showToast('Could not share', 'error'));
}

function setRating(appId, value){
  if(!currentUser){ showToast('Sign in to rate', 'warning'); openAccountModal(); return; }
  const app = allAppsCache.find(a=>a.id===appId);
  if(!app) return;
  const userRatings = app.userRatings || {};
  const oldRating = userRatings[currentUser.email] || 0;
  const appRef = db.collection("apps").doc(appId);
  let newSum = (app.ratingSum||0) - oldRating + value;
  let newCount = (app.ratingCount||0) - (oldRating>0?1:0) + 1;
  userRatings[currentUser.email] = value;
  appRef.update({ratingSum: newSum, ratingCount: newCount, ratingAvg: newSum/newCount, userRatings: userRatings}).then(()=>{
    showToast('Thanks for rating!', 'success', 1500);
    openAppDetails(appId);
  }).catch(err=>showToast('Error: '+err.message, 'error'));
}

function openAppDetails(appId){
  const app = allAppsCache.find(a=>a.id===appId);
  if(!app) return;
  let screenshotsHTML = '';
  if(app.screenshots && app.screenshots.length>0){
    app.screenshots.forEach(imgUrl=>{ screenshotsHTML += '<img src="'+imgUrl+'" class="screenshot-item" loading="lazy" onclick="openImgViewer(\''+imgUrl+'\')">'; });
  } else screenshotsHTML = '<p style="color:var(--subtext-color);font-size:11px;">No screenshots available.</p>';
  db.collection("apps").doc(appId).collection("comments").orderBy("createdAt","desc").get().then(snapshot=>{
    let commentsList = [];
    snapshot.forEach(doc=>commentsList.push({id:doc.id, ...doc.data()}));
    let commentsHTML = '';
    if(commentsList.length===0) commentsHTML = '<p style="color:var(--subtext-color);font-size:12px;text-align:center;">No comments yet. Be the first!</p>';
    else commentsList.forEach(c=>{
      commentsHTML += '<div class="comment-box" style="display:flex;justify-content:space-between;align-items:center;"><div><div class="comment-user">'+c.userName+'</div><div>'+c.text+'</div></div>'+(isAdmin?'<button onclick="deleteComment(\''+app.id+'\',\''+c.id+'\')" style="background:var(--danger);color:#fff;border:none;padding:3px 7px;border-radius:6px;font-size:10px;cursor:pointer;font-weight:bold;font-family:Inter,sans-serif;">Delete</button>':'')+'</div>';
    });
    let pubText = app.publisher ? '<div style="color:var(--accent);font-size:12px;font-weight:bold;margin-bottom:4px;">By '+app.publisher+'</div>' : '';
    let userRating = (app.userRatings && currentUser) ? (app.userRatings[currentUser.email]||0) : 0;
    let ratingAvg = getAverageRating(app);
    let isFav = userFavorites.includes(app.id);
    let starsHTML = '';
    for(let i=1;i<=5;i++) starsHTML += '<button class="star-btn '+(i<=userRating?'active':'')+'" onclick="setRating(\''+app.id+'\','+i+')"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>';
    let similarApps = allAppsCache.filter(a=>a.category===app.category && a.id!==app.id).slice(0,6);
    let similarHTML = '';
    if(similarApps.length>0){
      similarHTML = '<div style="border-top:1px solid var(--border-color);padding-top:10px;margin-bottom:10px;"><h4 style="font-size:12px;margin:0 0 6px 0;color:var(--text-color);">You might also like:</h4><div class="similar-apps-container">'+similarApps.map(s=>'<div class="similar-app-card" onclick="closeModal(\'appDetailModal\');setTimeout(()=>openAppDetails(\''+s.id+'\'),300);"><img src="'+(s.icon||FALLBACK_ICON)+'" onerror="this.src=\''+FALLBACK_ICON+'\'"><h5>'+s.name+'</h5><p>'+(s.size||'N/A')+'</p></div>').join('')+'</div></div>';
    }
    document.getElementById('appDetailBody').innerHTML = '<div style="width:40px;height:4px;background:var(--border-color);border-radius:10px;margin:0 auto 16px auto;"></div><div class="detail-header"><img src="'+(app.icon||FALLBACK_ICON)+'" class="detail-icon" onerror="this.src=\''+FALLBACK_ICON+'\'"><div style="flex:1;"><h3 style="margin:0 0 2px 0;font-size:16px;color:var(--text-color);">'+app.name+'</h3>'+pubText+'<div style="font-size:11px;color:var(--subtext-color);font-weight:600;margin-bottom:3px;">'+getCategoryNameEn(app.category)+' &bull; <span style="color:var(--danger);">'+(app.platform||'IPA')+'</span></div><div style="font-size:12px;color:var(--text-color);font-weight:bold;margin-bottom:3px;">Size: '+(app.size||'N/A')+'</div></div><button onclick="toggleFavorite(\''+app.id+'\',event)" style="background:'+(isFav?'rgba(255,69,58,0.15)':'var(--input-bg)')+';border:1px solid '+(isFav?'var(--danger)':'var(--border-color)')+';width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:'+(isFav?'var(--danger)':'var(--subtext-color)')+';">'+(isFav?ICONS.heartFill:ICONS.heart)+'</button></div><div style="background:var(--input-bg);padding:12px;border-radius:12px;margin-bottom:12px;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;"><span style="font-size:11px;color:var(--subtext-color);font-weight:700;">RATING</span><span style="font-size:12px;font-weight:800;color:var(--warning);">'+(ratingAvg>0?ratingAvg.toFixed(1)+' / 5':'No ratings')+' '+(app.ratingCount?'('+app.ratingCount+')':'')+'</span></div><div class="star-rating">'+starsHTML+'</div>'+(userRating>0?'<p style="margin:6px 0 0 0;font-size:10px;color:var(--subtext-color);">You rated: '+userRating+' stars</p>':'')+'</div><div style="background:var(--input-bg);padding:12px;border-radius:12px;margin-bottom:12px;font-size:12px;color:var(--text-color);"><strong style="color:var(--accent);display:flex;align-items:center;gap:5px;margin-bottom:4px;">'+ICONS.infoCircle+' Detailed Info:</strong>'+(app.info||app.desc||'No additional info available.')+'</div><button class="btn-install" style="display:flex;width:100%;text-align:center;padding:11px;margin-bottom:12px;font-size:13px;justify-content:center;" onclick="startRealDownload(\''+app.id+'\',\''+app.url+'\',\''+app.name+'\')">'+ICONS.download+' Direct Download ('+(app.platform||'IPA')+')</button><div style="border-top:1px solid var(--border-color);padding-top:10px;margin-bottom:10px;"><h4 style="font-size:12px;margin:0 0 6px 0;color:var(--text-color);">Screenshots:</h4><div class="screenshots-container">'+screenshotsHTML+'</div></div>'+similarHTML+'<div style="border-top:1px solid var(--border-color);padding-top:10px;"><h4 style="font-size:12px;margin:0 0 8px 0;color:var(--text-color);">Comments ('+commentsList.length+'):</h4><div style="max-height:140px;overflow-y:auto;margin-bottom:8px;" id="commentsListArea">'+commentsHTML+'</div>'+(currentUser?'<input type="text" id="newCommentText" class="input-field" placeholder="Write a comment..." style="margin-bottom:6px;"><button onclick="postComment(\''+app.id+'\')" style="background:var(--accent);color:#fff;border:none;width:100%;padding:8px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;font-family:Inter,sans-serif;">Post Comment</button>':'<p style="color:var(--danger);font-size:11px;text-align:center;">Sign in to comment.</p>')+'</div><button onclick="closeModal(\'appDetailModal\')" style="background:var(--input-bg);color:var(--text-color);border:none;width:100%;padding:9px;border-radius:10px;margin-top:12px;cursor:pointer;font-weight:bold;font-family:Inter,sans-serif;">Close</button>';
    document.getElementById('appDetailModal').style.display = 'flex';
  }).catch(err=>{ console.warn('Comments err:',err); });
}

function deleteComment(appId, commentId){
  if(!isAdmin) return;
  if(confirm('Delete this comment?')){
    db.collection("apps").doc(appId).collection("comments").doc(commentId).delete().then(()=>{
      db.collection("apps").doc(appId).update({commentsCount: firebase.firestore.FieldValue.increment(-1)}).catch(()=>{});
      showToast('Comment deleted', 'success');
      openAppDetails(appId);
    });
  }
}

function postComment(appId){
  if(!currentUser){ showToast('Sign in first', 'warning'); return; }
  const text = document.getElementById('newCommentText').value.trim();
  if(!text) return;
  db.collection("apps").doc(appId).collection("comments").add({userName: currentUser.email.split('@')[0], text: text, createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
    db.collection("apps").doc(appId).update({commentsCount: firebase.firestore.FieldValue.increment(1)}).catch(()=>{});
    showToast('Comment posted', 'success', 1500);
    document.getElementById('newCommentText').value = '';
    openAppDetails(appId);
  });
}

function openReportModal(appId){
  document.getElementById('reportAppId').value = appId;
  document.getElementById('reportReason').value = '';
  openModal('reportModal');
}
function setReportReasonText(t){ document.getElementById('reportReason').value = t; }

function submitReport(){
  const appId = document.getElementById('reportAppId').value;
  const reason = document.getElementById('reportReason').value.trim();
  if(!reason){ showToast('Please select or type a reason', 'warning'); return; }
  db.collection("reports").add({appId, reason, user: currentUser ? currentUser.email : 'Guest', createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
    showToast('Report sent', 'success');
    closeModal('reportModal');
  });
}

function deleteReport(reportId){
  if(!isAdmin) return;
  if(confirm('Delete this report?')){
    db.collection("reports").doc(reportId).delete();
    showToast('Report resolved', 'success');
  }
}

auth.onAuthStateChanged(user=>{
  currentUser = user;
  const floatBtn = document.getElementById('adminAddFloatBtn');
  const adminBadge = document.getElementById('adminBadge');
  const adminNavTab = document.getElementById('adminNavTab');
  if(user){
    document.getElementById('loggedOutView').style.display = 'none';
    document.getElementById('loggedInView').style.display = 'block';
    document.getElementById('userEmailText').innerText = user.email;
    if(user.email && ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(user.email.toLowerCase())){
      isAdmin = !isUserPreview;
      floatBtn.style.display = isAdmin ? 'flex' : 'none';
      adminBadge.style.display = isAdmin ? 'block' : 'none';
      adminNavTab.style.display = isAdmin ? 'flex' : 'none';
    } else {
      isAdmin = false; floatBtn.style.display = 'none'; adminBadge.style.display = 'none'; adminNavTab.style.display = 'none';
    }
  } else {
    isAdmin = false; floatBtn.style.display = 'none'; adminBadge.style.display = 'none'; adminNavTab.style.display = 'none';
    document.getElementById('loggedOutView').style.display = 'block';
    document.getElementById('loggedInView').style.display = 'none';
  }
  updateFavBtnVisibility();
  renderUI();
});

function handleSignOut(){
  auth.signOut().then(()=>{
    currentUser = null; isAdmin = false;
    closeModal('accountModal');
    renderUI();
    showToast('Signed out', 'info');
  });
}
function loginWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(()=>auth.signInWithRedirect(provider));
}
function openAccountModal(){ openModal('accountModal'); }

function openAddAppModal(){
  if(!isAdmin) return;
  document.getElementById('modalTitleText').innerText = "Add App to Cloud";
  document.getElementById('editingAppId').value = "";
  document.getElementById('appPublisher').value = "";
  document.getElementById('appName').value = "";
  document.getElementById('appSize').value = "";
  document.getElementById('appInfo').value = "";
  document.getElementById('appUrl').value = "";
  document.getElementById('appImgFile').value = "";
  document.getElementById('appScreenshotsFile').value = "";
  document.getElementById('appExtraFiles').value = "";
  openModal('addAppModal');
}

function openEditAppModal(id){
  if(!isAdmin) return;
  const app = allAppsCache.find(a=>a.id===id);
  if(!app) return;
  document.getElementById('modalTitleText').innerText = "Edit App";

  document.getElementById('appPublisher').value = app.publisher || '';
  document.getElementById('appCategory').value = app.category || 'today';
  document.getElementById('appPlatform').value = app.platform || 'IPA';
  document.getElementById('appName').value = app.name || '';
  document.getElementById('appSize').value = app.size || '';
  document.getElementById('appInfo').value = app.info || '';
  document.getElementById('appUrl').value = app.url || '';
  openModal('addAppModal');
}

function fileToDataURL(file){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

async function saveNewApp(){
  if(!isAdmin) return;
  const editingId = document.getElementById('editingAppId').value;
  const publisher = document.getElementById('appPublisher').value.trim();
  const category = document.getElementById('appCategory').value;
  const platform = document.getElementById('appPlatform').value;
  const name = document.getElementById('appName').value;
  const size = document.getElementById('appSize').value;
  const info = document.getElementById('appInfo').value;
  const url = document.getElementById('appUrl').value || '#';
  const fileInput = document.getElementById('appImgFile');
  const screenshotsInput = document.getElementById('appScreenshotsFile');
  const extraFilesInput = document.getElementById('appExtraFiles');
  if(!name){ showToast('Please enter app name', 'warning'); return; }

  let iconResult = FALLBACK_ICON;
  let existingScreenshots = [];
  let existingExtraFiles = [];
  if(editingId){
    const found = allAppsCache.find(a=>a.id===editingId);
    if(found){
      iconResult = found.icon || FALLBACK_ICON;
      if(found.screenshots) existingScreenshots = found.screenshots;
      if(found.extraFiles) existingExtraFiles = found.extraFiles;
    }
  }

  try {
    if(fileInput.files && fileInput.files[0]) iconResult = await fileToDataURL(fileInput.files[0]);
    let screenshotsList = [...existingScreenshots];
    if(screenshotsInput.files && screenshotsInput.files.length>0){
      for(const file of Array.from(screenshotsInput.files)) screenshotsList.push(await fileToDataURL(file));
    }
    let extraFilesList = [...existingExtraFiles];
    if(extraFilesInput.files && extraFilesInput.files.length>0){
      for(const file of Array.from(extraFilesInput.files)) extraFilesList.push({name: file.name, url: url});
    }

    if(editingId){
      await db.collection("apps").doc(editingId).update({publisher, category, platform, name, size, info, url, icon: iconResult, screenshots: screenshotsList, extraFiles: extraFilesList});
      showToast('App updated', 'success');
    } else {
      await db.collection("apps").add({publisher, category, platform, name, size, info, url, icon: iconResult, screenshots: screenshotsList, extraFiles: extraFilesList, likedBy: [], downloadedBy: [], downloads: 0, commentsCount: 0, ratingSum: 0, ratingCount: 0, ratingAvg: 0, userRatings: {}, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
      showToast('App published', 'success');
    }
    document.getElementById('appPublisher').value = '';
    document.getElementById('appName').value = '';
    document.getElementById('appSize').value = '';
    document.getElementById('appInfo').value = '';
    document.getElementById('appUrl').value = '';
    document.getElementById('appImgFile').value = '';
    document.getElementById('appScreenshotsFile').value = '';
    document.getElementById('appExtraFiles').value = '';
    closeModal('addAppModal');
  } catch(err){ showToast('Error: '+err.message, 'error'); }
}

function deleteApp(id){
  if(!isAdmin) return;
  if(confirm('Delete this app permanently?')){
    db.collection("apps").doc(id).delete().then(()=>showToast('App deleted', 'success'));
  }
}
