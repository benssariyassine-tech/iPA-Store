<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iStore - IPA & APK Store</title>
    <link rel="manifest" href="data:application/json,{%22name%22:%22iStore%22,%22short_name%22:%22iStore%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230b0b0f%22,%22theme_color%22:%22%230a84ff%22}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --text-color: #ffffff;
            --card-bg: #16161c;
            --border-color: rgba(255,255,255,0.08);
            --subtext-color: #8e8e93;
            --header-bg: rgba(11, 11, 15, 0.9);
            --nav-bg: rgba(18, 18, 24, 0.75);
            --modal-bg: #16161c;
            --input-bg: #0b0b0f;
            --accent: #0a84ff;
            --accent-2: #0062d2;
            --danger: #ff453a;
            --success: #32d74b;
            --warning: #ff9f0a;
        }

        body.light-mode {
            --bg-color: #f2f2f7;
            --text-color: #000000;
            --card-bg: #ffffff;
            --border-color: rgba(0,0,0,0.08);
            --subtext-color: #636366;
            --header-bg: rgba(242, 242, 247, 0.9);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --modal-bg: #ffffff;
            --input-bg: #f2f2f7;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0 0 110px 0;
            transition: background 0.3s, color 0.3s;
            overscroll-behavior-y: contain;
        }

        /* ============ SPLASH SCREEN ============ */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.6s ease;
        }
        #splashScreen.hide { opacity: 0; pointer-events: none; }
        .splash-logo {
            animation: splashPulse 1.5s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        .splash-loader {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============ PULL TO REFRESH ============ */
        #pullIndicator {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            z-index: 1500;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        #pullIndicator.active { transform: translateX(-50%) translateY(0); }
        .pull-spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ============ HEADER ============ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; letter-spacing: 0.5px; }
        .logo-area span { color: var(--accent); }

        .header-icons { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 4px; right: 4px;
            width: 8px; height: 8px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid var(--header-bg);
        }

        /* ============ CONTAINER ============ */
        .container { padding: 16px 20px; max-width: 600px; margin: auto; animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ SEARCH ============ */
        .search-box { position: relative; margin-bottom: 12px; }
        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px 45px 12px 45px;
            border-radius: 16px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(10,132,255,0.25); }
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--subtext-color);
            width: 18px; height: 18px;
            pointer-events: none;
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .search-clear.show { display: flex; }

        /* ============ FILTER CHIPS ============ */
        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 5px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--subtext-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .chip:active { transform: scale(0.95); }

        /* ============ TODAY HEADER ============ */
        .today-header { margin-bottom: 15px; animation: fadeInUp 0.4s ease; }
        .today-date { color: var(--subtext-color); font-size: 12px; font-weight: 600; }
        .today-title { font-size: 28px; font-weight: 900; margin: 2px 0; }
        .today-subtitle { font-size: 13px; color: var(--danger); font-weight: 700; display: flex; align-items: center; gap: 5px; }

        /* ============ FEATURED CARD ============ */
        .featured-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            animation: fadeInUp 0.4s ease;
        }
        .featured-img-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: var(--input-bg);
        }
        .featured-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .featured-card:hover .featured-img { transform: scale(1.05); }

        .platform-badge-float {
            position: absolute;
            top: 8px;
            right: -28px;
            background: var(--danger);
            color: #fff;
            padding: 2px 28px;
            font-size: 8px;
            font-weight: 900;
            transform: rotate(45deg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
            z-index: 10;
            pointer-events: none;
        }

        .featured-body { padding: 16px; }
        .badge-tag { background: rgba(255,69,58,0.15); color: var(--danger); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }

        .section-heading { font-size: 17px; font-weight: 800; margin: 20px 0 12px 0; display: flex; justify-content: space-between; align-items: center; }

        /* ============ APP CARD ============ */
        .app-card-pro {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeInUp 0.3s ease;
            position: relative;
            overflow: visible;
            transition: border-color 0.2s;
        }
        .app-card-pro:hover { border-color: rgba(10,132,255,0.3); }

        .app-meta { display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1; cursor: pointer; }
        .app-icon-container { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
        .app-icon-img { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border-color); background: var(--input-bg); }

        .app-details { overflow: hidden; flex: 1; max-width: 160px; }
        .app-details h4 {
            margin: 0 0 2px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.2;
        }

        .app-title-marquee { display: inline-block; white-space: nowrap; animation: marqueeScroll 8s ease-in-out infinite alternate; }
        @keyframes marqueeScroll {
            0%, 20% { transform: translateX(0); }
            80%, 100% { transform: translateX(-35%); }
        }

        .app-details p { margin: 0; font-size: 10px; color: var(--subtext-color); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
        .app-publisher-tag { font-size: 10px; color: var(--accent); font-weight: 700; display: block; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-size-tag-red { background: rgba(255,69,58,0.15); color: var(--danger); font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; display: inline-block; }
        .download-badge-green { background: rgba(50, 215, 75, 0.15); color: var(--success); font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; display: inline-flex; align-items: center; gap: 3px; }
        .rating-badge-gold { background: rgba(255, 159, 10, 0.15); color: var(--warning); font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; display: inline-flex; align-items: center; gap: 3px; }
        .app-category-sub { font-size: 10px; color: var(--subtext-color); font-weight: 600; margin-top: 1px; }

        .app-actions { display: flex; gap: 5px; align-items: center; position: relative; flex-shrink: 0; }

        .btn-install {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            border: none;
            box-shadow: 0 3px 10px rgba(10,132,255,0.3);
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-install:active { transform: scale(0.94); }

        .btn-star-like {
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.3);
            color: var(--warning);
            padding: 4px 7px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
            transition: 0.2s;
        }
        .btn-star-like:active { transform: scale(0.9); }
        .btn-star-like.liked { background: rgba(255, 159, 10, 0.25); }

        .btn-extra-dropdown {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .extra-files-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 36px;
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            width: 170px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 50;
        }
        .extra-file-item {
            display: block;
            padding: 6px 8px;
            font-size: 11px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 6px;
            background: var(--input-bg);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .extra-file-item:hover { background: rgba(10,132,255,0.15); color: var(--accent); }

        .admin-btns { display: flex; gap: 4px; }
        .btn-edit { background: var(--accent); color: #fff; padding: 4px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; }
        .btn-del { background: var(--danger); color: #fff; padding: 4px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; border: none; cursor: pointer; }

        .btn-info-blue {
            background: rgba(10, 132, 255, 0.15);
            border: 1px solid rgba(10, 132, 255, 0.3);
            color: var(--accent);
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .btn-info-blue:active { transform: scale(0.9); }

        .btn-report-text {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 4px;
            font-family: 'Inter', sans-serif;
        }

        /* ============ DOWNLOAD PROGRESS ============ */
        .dl-progress-box {
            width: 100%;
            margin-top: 6px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px 8px;
            box-sizing: border-box;
        }
        .dl-progress-text { font-size: 10px; font-weight: 800; color: var(--danger); margin-bottom: 3px; display: flex; justify-content: space-between; }
        .dl-progress-bar-bg { width: 100%; height: 5px; background: rgba(255,69,58,0.15); border-radius: 4px; overflow: hidden; }
        .dl-progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--danger), #ff6b5e); transition: width 0.1s linear; }

        /* ============ SKELETON ============ */
        .skeleton-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .skeleton-box {
            background: linear-gradient(90deg, var(--border-color) 25%, rgba(255,255,255,0.05) 50%, var(--border-color) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ============ FLOATING NAV ============ */
        .floating-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--subtext-color);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: 0.25s;
        }
        .nav-item.active { color: var(--accent); transform: scale(1.08); }
        .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        /* ============ MODALS ============ */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            inset: 0;
            background: rgba(0,0,0,0.75);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .modal-box {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 22px;
            width: 88%;
            max-width: 360px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close-x {
            position: absolute;
            top: 16px; right: 16px;
            background: var(--input-bg);
            border: none;
            color: var(--text-color);
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ============ BOTTOM SHEET ============ */
        .bottom-sheet-modal {
            display: none;
            position: fixed;
            z-index: 2500;
            inset: 0;
            background: rgba(0,0,0,0.7);
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .bottom-sheet-content {
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 24px 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
            animation: slideUpSheet 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        /* ============ SCREENSHOTS ============ */
        .screenshots-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin: 12px 0;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .screenshots-container::-webkit-scrollbar { display: none; }
        .screenshot-item {
            width: 130px;
            height: 230px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            scroll-snap-align: start;
            cursor: pointer;
            background: var(--input-bg);
        }

        /* ============ INPUT FIELDS ============ */
        .input-field {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus { border-color: var(--accent); }

        /* ============ ADMIN ============ */
        .admin-add-float {
            position: fixed;
            bottom: 84px;
            right: 20px;
            background: var(--danger);
            color: #fff;
            padding: 9px 16px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(255,69,58,0.4);
            cursor: pointer;
            z-index: 999;
            display: none;
        }
        .admin-dashboard-wrapper { display: flex; flex-direction: column; gap: 16px; animation: fadeInUp 0.4s ease; }
        .admin-section-card { background: var(--card-bg); border: 1px solid rgba(255,69,58,0.25); border-radius: 20px; padding: 18px; }
        .admin-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .stat-box { background: var(--input-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 14px; text-align: center; }
        .stat-box h5 { margin: 0 0 6px 0; color: var(--subtext-color); font-size: 11px; font-weight: 700; }
        .stat-box p { margin: 0; color: var(--danger); font-size: 20px; font-weight: 900; }
        .report-admin-item { background: var(--input-bg); border: 1px solid rgba(255,69,58,0.3); padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 12px; }

        /* ============ DETAILS ============ */
        .detail-header { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        .detail-icon { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; border: 1px solid var(--border-color); background: var(--input-bg); }
        .comment-box { background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; font-size: 12px; }
        .comment-user { color: var(--accent); font-weight: 700; margin-bottom: 2px; }

        /* ============ STAR RATING ============ */
        .star-rating { display: flex; gap: 4px; margin: 8px 0; }
        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            font-size: 24px;
            line-height: 1;
            color: var(--border-color);
            transition: 0.15s;
            font-family: Arial, sans-serif;
        }
        .star-btn.active, .star-btn:hover { color: var(--warning); transform: scale(1.15); }

        /* ============ TOAST ============ */
        #toastContainer {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 90%;
        }
        .toast {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            min-width: 220px;
        }
        .toast.success { border-color: rgba(50,215,75,0.4); }
        .toast.success .toast-icon { color: var(--success); }
        .toast.error { border-color: rgba(255,69,58,0.4); }
        .toast.error .toast-icon { color: var(--danger); }
        .toast.info .toast-icon { color: var(--accent); }
        .toast.warning .toast-icon { color: var(--warning); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }

        /* ============ SHARE BUTTON ============ */
        .btn-share {
            background: rgba(10,132,255,0.1);
            border: 1px solid rgba(10,132,255,0.3);
            color: var(--accent);
            padding: 4px 7px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
            transition: 0.2s;
        }
        .btn-share:active { transform: scale(0.9); }

        /* ============ FAVORITES TAB ============ */
        .fav-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--subtext-color);
        }
        .fav-empty svg { width: 60px; height: 60px; stroke: var(--border-color); fill: none; stroke-width: 1.5; margin-bottom: 15px; }

        /* ============ SIMILAR APPS ============ */
        .similar-apps-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none;
        }
        .similar-apps-container::-webkit-scrollbar { display: none; }
        .similar-app-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            min-width: 110px;
            max-width: 110px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .similar-app-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .similar-app-card img { width: 50px; height: 50px; border-radius: 12px; margin-bottom: 6px; }
        .similar-app-card h5 { font-size: 11px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); font-weight: 700; }
        .similar-app-card p { font-size: 9px; margin: 3px 0 0 0; color: var(--subtext-color); }

        /* ============ PREVIEW BAR ============ */
        .preview-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--warning);
            color: #000;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* ============ IMAGE VIEWER ============ */
        #imgViewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10001;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #imgViewer img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            object-fit: contain;
            animation: popIn 0.3s;
        }
        #imgViewer .close-viewer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        /* ============ UPLOAD PROGRESS ============ */
        .upload-progress-bar {
            width: 100%;
            height: 6px;
            background: var(--input-bg);
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
            display: none;
        }
        .upload-progress-bar.show { display: block; }
        .upload-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.3s;
        }
    </style>

        let isAdmin = false;
        let isUserPreview = false;
        let currentTab = 'today';
        let allAppsCache = [];
        let allReportsCache = [];
        let isLightMode = false;
        let currentFilter = 'all';
        let userFavorites = [];

        const FALLBACK_ICON = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%230a84ff"/><text x="50" y="62" font-size="50" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">A</text></svg>';

        // ============ TOAST SYSTEM ============
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: '<svg class="toast-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>',
                error: '<svg class="toast-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
                warning: '<svg class="toast-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
                info: '<svg class="toast-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
            };
            toast.innerHTML = `${icons[type] || icons.info}<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.4s forwards';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ============ MODAL HELPERS ============
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }

        // ============ LOCALSTORAGE ============
        function savePrefs() {
            localStorage.setItem('istore_prefs', JSON.stringify({
                lightMode: isLightMode,
                tab: currentTab,
                favorites: userFavorites
            }));
        }
        function loadPrefs() {
            try {
                const p = JSON.parse(localStorage.getItem('istore_prefs') || '{}');
                if (p.lightMode) { isLightMode = true; document.body.classList.add('light-mode'); }
                if (p.favorites) userFavorites = p.favorites;
                if (p.tab && !['admin_panel'].includes(p.tab)) currentTab = p.tab;
            } catch(e) {}
        }

        // ============ IMAGE VIEWER ============
        function openImgViewer(src) {
            document.getElementById('imgViewerImg').src = src;
            document.getElementById('imgViewer').style.display = 'flex';
        }
        function closeImgViewer() {
            document.getElementById('imgViewer').style.display = 'none';
        }

        // ============ PREVIEW MODE ============
        function toggleUserPreview() {
            isUserPreview = !isUserPreview;
            const user = auth.currentUser;
            if (user && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase())) {
                isAdmin = !isUserPreview;
            }
            document.getElementById('previewBar').style.display = isUserPreview ? 'flex' : 'none';
            document.getElementById('adminAddFloatBtn').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('adminNavTab').style.display = isAdmin ? 'flex' : 'none';
            renderUI();
        }

        // ============ DARK MODE ============
        function toggleDarkMode() {
            isLightMode = !isLightMode;
            document.body.classList.toggle('light-mode', isLightMode);
            const icon = document.getElementById('themeIcon');
            if(isLightMode) {
                icon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            } else {
                icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            }
            savePrefs();
            showToast(isLightMode ? '☀️ Light mode' : '🌙 Dark mode', 'info', 1500);
        }

        function getActualDateString() {
            return new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        // ============ TAB SWITCHING ============
        function switchTab(tabName, btnElement) {
            currentTab = tabName;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            } else {
                const targetBtn = document.querySelector(`.nav-item[data-tab="${tabName}"]`);
                if (targetBtn) targetBtn.classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
            savePrefs();
            renderUI();
        }

        // ============ FIRESTORE LISTENERS (with error handling) ============
        db.collection("apps").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            allAppsCache = [];
            snapshot.forEach(doc => {
                let data = doc.data();
                if(data.name && data.name.toLowerCase().includes("gta") && data.category !== "games") {
                    data.category = "games";
                }
                allAppsCache.push({ id: doc.id, ...data });
            });
            renderUI();
        }, err => {
            console.warn('Apps query error:', err);
            showToast('Error loading apps: ' + err.code, 'error');
        });

        db.collection("reports").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            allReportsCache = [];
            snapshot.forEach(doc => {
                allReportsCache.push({ id: doc.id, ...doc.data() });
            });
            if (currentTab === 'admin_panel') renderUI();
        }, err => {
            console.warn('Reports query error:', err);
        });

        // ============ SEARCH ============
        function onSearchInput() {
            const val = document.getElementById('searchInput').value;
            document.getElementById('searchClear').classList.toggle('show', val.length > 0);
            renderUI();
        }
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').classList.remove('show');
            renderUI();
        }

        // ============ TRENDING SCORE ============
        function getTrendingScore(app) {
            const likes = (app.likedBy && Array.isArray(app.likedBy)) ? app.likedBy.length : 0;
            const downloads = app.downloads || 0;
            const comments = app.commentsCount || 0;
            const ratingAvg = app.ratingAvg || 0;
            const ratingCount = app.ratingCount || 0;
            return (likes * 15) + (downloads * 5) + (comments * 10) + (ratingAvg * ratingCount * 20);
        }

        function getAverageRating(app) {
            if (!app.ratingCount || app.ratingCount === 0) return 0;
            return (app.ratingSum || 0) / app.ratingCount;
        }

        // ============ RENDER SKELETON ============
        function renderSkeleton() {
            let html = '';
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="skeleton-card">
                        <div class="skeleton-box" style="width:54px; height:54px; border-radius:14px; flex-shrink:0;"></div>
                        <div style="flex:1;">
                            <div class="skeleton-box" style="height:12px; width:70%; margin-bottom:8px;"></div>
                            <div class="skeleton-box" style="height:10px; width:50%; margin-bottom:6px;"></div>
                            <div class="skeleton-box" style="height:10px; width:40%;"></div>
                        </div>
                    </div>
                `;
            }
            return html;
        }

        // ============ MAIN RENDER ============
        function renderUI() {
            const container = document.getElementById('dynamicContent');
            const searchInputEl = document.getElementById('searchInput');
            const searchQuery = searchInputEl ? searchInputEl.value.toLowerCase().trim() : '';

            // SEARCH MODE
            if (searchQuery !== "") {
                let filtered = allAppsCache.filter(app =>
                    (app.name && app.name.toLowerCase().includes(searchQuery)) ||
                    (app.info && app.info.toLowerCase().includes(searchQuery)) ||
                    (app.publisher && app.publisher.toLowerCase().includes(searchQuery))
                );
                container.innerHTML = `
                    <div class="filter-chips">
                        <button class="chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All (${filtered.length})</button>
                        <button class="chip ${currentFilter === 'IPA' ? 'active' : ''}" onclick="setFilter('IPA')">iOS</button>
                        <button class="chip ${currentFilter === 'APK' ? 'active' : ''}" onclick="setFilter('APK')">Android</button>
                        <button class="chip ${currentFilter === 'games' ? 'active' : ''}" onclick="setFilter('games')">Games</button>
                        <button class="chip ${currentFilter === 'apps' ? 'active' : ''}" onclick="setFilter('apps')">Apps</button>
                    </div>
                    <div class="section-heading">Search Results (${filtered.length})</div>
                    <div id="searchResContainer"></div>
                `;
                let filtered2 = filtered;
                if (currentFilter === 'IPA' || currentFilter === 'APK') {
                    filtered2 = filtered.filter(a => (a.platform || 'IPA') === currentFilter);
                } else if (currentFilter !== 'all') {
                    filtered2 = filtered.filter(a => a.category === currentFilter);
                }
                const sContainer = document.getElementById('searchResContainer');
                if (filtered2.length === 0) {
                    sContainer.innerHTML = `<p style="color:var(--subtext-color); text-align:center; font-size:13px; margin-top:30px;">No matching apps found.</p>`;
                } else {
                    filtered2.forEach(app => sContainer.innerHTML += createAppCardHTML(app));
                }
                return;
            }

            // FAVORITES TAB
            if (currentTab === 'favorites') {
                const favApps = allAppsCache.filter(a => userFavorites.includes(a.id));
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">❤️ My Favorites</div>
                        <div class="today-subtitle">Your saved apps</div>
                    </div>
                    <div id="favContainer" style="margin-top:15px;"></div>
                `;
                const fContainer = document.getElementById('favContainer');
                if (favApps.length === 0) {
                    fContainer.innerHTML = `
                        <div class="fav-empty">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <p style="font-size:14px; font-weight:700; margin:0 0 5px 0; color:var(--text-color);">No favorites yet</p>
                            <p style="font-size:12px;">Tap the heart ❤️ on any app to save it here</p>
                        </div>
                    `;
                } else {
                    favApps.forEach(app => fContainer.innerHTML += createAppCardHTML(app));
                }
                return;
            }

            // ADMIN PANEL
            if (currentTab === 'admin_panel' && isAdmin) {
                let totalApps = allAppsCache.length;
                let totalReports = allReportsCache.length;
                let totalDownloads = allAppsCache.reduce((s,a) => s + (a.downloads || 0), 0);
                let totalLikes = allAppsCache.reduce((s,a) => s + ((a.likedBy && a.likedBy.length) || 0), 0);
                
                let reportsHTML = "";
                if(totalReports === 0) {
                    reportsHTML = `<div style="text-align:center; padding:25px 0;"><p style="color:var(--success); font-weight:700; font-size:13px; margin:0;">✨ Awesome! No pending reports.</p></div>`;
                } else {
                    allReportsCache.forEach(rep => {
                        let targetApp = allAppsCache.find(a => a.id === rep.appId);
                        let appName = targetApp ? targetApp.name : "Unknown/Deleted App";
                        reportsHTML += `
                            <div class="report-admin-item">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                    <span style="color:var(--danger); font-weight:900; font-size:12px;">🚨 ${appName}</span>
                                    <span style="color:var(--subtext-color); font-size:10px;">By: ${rep.user}</span>
                                </div>
                                <div style="color:var(--text-color); font-size:12px; margin-bottom:8px; background:var(--modal-bg); padding:6px 8px; border-radius:6px;">💬 "${rep.reason}"</div>
                                <div style="display:flex; justify-content:flex-end;">
                                    <button onclick="deleteReport('${rep.id}')" style="background:var(--danger); color:#fff; border:none; padding:4px 10px; border-radius:6px; font-weight:bold; font-size:10px; cursor:pointer;">Resolve</button>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">Admin Dashboard</div>
                        <div class="today-subtitle">👑 iStore Control Center</div>
                    </div>
                    
                    <div style="margin-bottom:15px;">
                        <button onclick="toggleUserPreview()" style="background:var(--accent); color:#fff; border:none; padding:9px 15px; border-radius:12px; font-weight:bold; font-size:12px; cursor:pointer; width:100%;">👁️ Switch to User Preview</button>
                    </div>

                    <div class="admin-dashboard-wrapper">
                        <div class="admin-section-card">
                            <h4 style="font-size:13px; margin:0 0 10px 0; color:var(--text-color); border-bottom:1px solid var(--border-color); padding-bottom:6px;">📊 Platform Stats</h4>
                            <div class="admin-stats-grid">
                                <div class="stat-box"><h5>Total Apps</h5><p style="color:var(--text-color);">${totalApps}</p></div>
                                <div class="stat-box"><h5>Reports</h5><p>${totalReports}</p></div>
                                <div class="stat-box"><h5>Downloads</h5><p style="color:var(--success);">${totalDownloads}</p></div>
                                <div class="stat-box"><h5>Likes</h5><p style="color:var(--warning);">${totalLikes}</p></div>
                            </div>
                        </div>

                        <div class="admin-section-card">
                            <h4 style="font-size:13px; margin:0 0 10px 0; color:var(--text-color); border-bottom:1px solid var(--border-color); padding-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                                <span>🚨 User Reports</span>
                                <span style="background:rgba(255,69,58,0.15); color:var(--danger); font-size:10px; padding:2px 8px; border-radius:6px; font-weight:900;">${totalReports}</span>
                            </h4>
                            <div style="max-height:350px; overflow-y:auto;">${reportsHTML}</div>
                        </div>
                    </div>
                `;
                return;
            }

            // TODAY TAB
            if (currentTab === 'today') {
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-date">${getActualDateString()}</div>
                        <div class="today-title">Today</div>
                        <div class="today-subtitle">🔥 Special Updates & Highlights</div>
                    </div>
                    <div id="todayAppsContainer">${renderSkeleton()}</div>
                    <div class="section-heading">Trending & More</div>
                    <div id="generalAppsContainer"></div>
                `;
                
                let sortedByTrending = [...allAppsCache].sort((a,b) => getTrendingScore(b) - getTrendingScore(a));
                const todayList = sortedByTrending.filter(app => app.category === 'today' || !app.category);
                const generalList = sortedByTrending;

                const tContainer = document.getElementById('todayAppsContainer');
                tContainer.innerHTML = '';
                if (todayList.length === 0) {
                    tContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center;">No featured apps yet.</p>`;
                } else {
                    todayList.forEach((app, index) => {
                        tContainer.innerHTML += createFeaturedCardHTML(app, index);
                    });
                }

                const gContainer = document.getElementById('generalAppsContainer');
                if (generalList.length === 0) {
                    gContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center;">No apps yet.</p>`;
                } else {
                    generalList.forEach((app, idx) => {
                        let rankBadge = (idx === 0) ? '<span style="color:var(--danger); font-weight:900; margin-right:4px;">#1</span>' : '';
                        gContainer.innerHTML += createAppCardHTML(app, rankBadge);
                    });
                }
                return;
            }

            // TRENDING
            if (currentTab === 'trending') {
                let sortedByTrending = [...allAppsCache].sort((a,b) => getTrendingScore(b) - getTrendingScore(a));
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">🔥 Trending</div>
                        <div class="today-subtitle">Most popular apps</div>
                    </div>
                    <div class="filter-chips">
                        <button class="chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>
                        <button class="chip ${currentFilter === 'IPA' ? 'active' : ''}" onclick="setFilter('IPA')">iOS</button>
                        <button class="chip ${currentFilter === 'APK' ? 'active' : ''}" onclick="setFilter('APK')">Android</button>
                    </div>
                    <div id="trendingContainer" style="margin-top:10px;"></div>
                `;
                let list = sortedByTrending;
                if (currentFilter === 'IPA' || currentFilter === 'APK') list = list.filter(a => (a.platform || 'IPA') === currentFilter);
                const trContainer = document.getElementById('trendingContainer');
                if (list.length === 0) {
                    trContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center; margin-top:40px;">No trending apps.</p>`;
                } else {
                    list.forEach((app, idx) => {
                        let rankBadge = `<span style="color:var(--danger); font-weight:900; margin-right:4px;">#${idx + 1}</span>`;
                        trContainer.innerHTML += createAppCardHTML(app, rankBadge);
                    });
                }
                return;
            }

            // TOOLS
            if (currentTab === 'tools') {
                container.innerHTML = `
                    <div class="today-header">
                        <div class="today-title">Installation Tools</div>
                        <div class="today-subtitle">Signing guides & tools</div>
                    </div>
                    <div style="margin-top:15px;">
                        <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:16px; padding:15px; margin-bottom:12px;">
                            <h3 style="color:var(--danger); margin-top:0; font-size:15px;">E-Sign App</h3>
                            <p style="color:var(--subtext-color); font-size:12px; line-height:1.5;"><strong>E-Sign</strong> is one of the best tools to sign and install IPA files directly on iPhone without a computer.</p>
                        </div>
                    </div>
                `;
                return;
            }

            // GAMES / APPS
            let tabFiltered = allAppsCache.filter(app => app.category === currentTab);
            tabFiltered.sort((a,b) => getTrendingScore(b) - getTrendingScore(a));
            const titles = { games: 'Games', apps: 'Apps' };
            container.innerHTML = `
                <div class="today-header">
                    <div class="today-title">${titles[currentTab] || 'Apps'}</div>
                    <div class="today-subtitle">Continuously updated library</div>
                </div>
                <div class="filter-chips">
                    <button class="chip ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>
                    <button class="chip ${currentFilter === 'IPA' ? 'active' : ''}" onclick="setFilter('IPA')">iOS</button>
                    <button class="chip ${currentFilter === 'APK' ? 'active' : ''}" onclick="setFilter('APK')">Android</button>
                </div>
                <div id="filteredContainer" style="margin-top:10px;"></div>
            `;
            let list = tabFiltered;
            if (currentFilter === 'IPA' || currentFilter === 'APK') list = list.filter(a => (a.platform || 'IPA') === currentFilter);
            const fContainer = document.getElementById('filteredContainer');
            if (list.length === 0) {
                fContainer.innerHTML = `<p style="color:var(--subtext-color); font-size:13px; text-align:center; margin-top:40px;">No apps in this category yet.</p>`;
            } else {
                list.forEach((app, idx) => {
                    let rankBadge = (idx === 0) ? '<span style="color:var(--danger); font-weight:900; margin-right:4px;">#1</span>' : '';
                    fContainer.innerHTML += createAppCardHTML(app, rankBadge);
                });
            }
        }

        function setFilter(f) {
            currentFilter = f;
            renderUI();
        }

        // ============ CARD BUILDERS ============
        function getCategoryNameEn(cat) {
            const map = { games: 'Games', apps: 'Apps', tools: 'Tools', today: 'Utilities' };
            return map[cat] || 'Utilities';
        }

        function createFeaturedCardHTML(app, index) {
            let isTopOne = (index === 0) ? '<span style="background:var(--danger); color:#fff; font-size:9px; font-weight:900; padding:2px 6px; border-radius:5px; margin-left:6px;">#1 Trending</span>' : '';
            let platformType = app.platform || 'IPA';
            let pubText = app.publisher ? `<span class="app-publisher-tag">By ${app.publisher}</span>` : '';
            let likesCount = (app.likedBy && Array.isArray(app.likedBy)) ? app.likedBy.length : 0;
            let isLiked = (currentUser && app.likedBy && app.likedBy.includes(currentUser.email));
            let isFav = userFavorites.includes(app.id);
            let ratingAvg = getAverageRating(app);

            return `
                <div class="featured-card">
                    <div class="platform-badge-float">${platformType}</div>
                    <div class="featured-img-wrapper" onclick="openAppDetails('${app.id}')" style="cursor:pointer;">
                        <img src="${app.icon || FALLBACK_ICON}" class="featured-img" loading="lazy" onerror="this.src='${FALLBACK_ICON}'">
                    </div>
                    <div class="featured-body">
                        <div style="display:flex; align-items:center; margin-bottom:6px; justify-content:space-between;">
                            <span class="badge-tag" style="margin-bottom:0;">⭐ Featured</span>
                            ${isTopOne}
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h3 style="margin:4px 0 2px 0; font-size:16px; cursor:pointer;" onclick="openAppDetails('${app.id}')">${app.name}</h3>
                                ${pubText}
                            </div>
                            <button class="btn-info-blue" onclick="openAppDetails('${app.id}')">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            </button>
                        </div>
                        <div class="app-category-sub" style="margin-bottom:4px;">${getCategoryNameEn(app.category)} ${ratingAvg > 0 ? `• ⭐ ${ratingAvg.toFixed(1)}` : ''}</div>
                        <div style="display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap;">
                            <div class="app-size-tag-red">Size: ${app.size || 'N/A'}</div>
                            <div class="download-badge-green">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                ${app.downloads || 0}
                            </div>
                        </div>
                        <p style="color:var(--subtext-color); font-size:12px; margin:8px 0 12px 0;">${app.info || ''}</p>
